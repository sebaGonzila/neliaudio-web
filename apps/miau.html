/* Por fuera, un chat con la piel de Meowdacity; por dentro, la pantallita negra con los números de la frase. */
:root {
  --fondo: #000; --fondo-img: none; --panel: #04100A; --barra: #08180F; --linea: #0E3A24; --linea-suave: #0E3A24;
  --tenue: #2F9E63; --neon: #6CFFA8; --neon-borde: #6CFFA8; --neon-suave: rgba(108,255,168,.14); --texto: #A8F0C8; --tinta: #F2FFF7; --sobre-neon: #000;
  --lienzo: #010502; --rejilla: #041A0E; --cero: #0E3A24; --onda: #B794FF; --alto: #F2FFF7; --ve: #B794FF; --cabezal: #4CC9FF; --salto: #FFD23F;
  --umbral: #FF6B8B; --ambar: #FFD23F; --nota: #4CC9FF; --tecla: #071A10; --negra: #000; --brillo: rgba(108,255,168,.45);
  --radio: 0px; --radio-btn: 0px; --pista: #0E3A24; --boton: transparent;
  --sombra-panel: 6px 6px 0 #0E3A24; --sombra-btn: 3px 3px 0 #0E3A24;
  --f-marca: 'Silkscreen', 'Courier New', monospace;
  --f-etiqueta: 'Silkscreen', 'Courier New', monospace;
  --f-numero: 'VT323', 'Courier New', monospace;
  --f-texto: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --k-num: 1;                       /* VT323 es chica: la otra fuente de números se escala a 0,72 */
  --borde: 2px;
  color-scheme: dark;
}
body[data-piel="neli"] {
  --fondo: #E4E0F8; --fondo-img: radial-gradient(1200px 600px at 15% -10%, #F3EEFF 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #D6DDF8 0%, transparent 60%), linear-gradient(160deg, #E9E3FB, #DCDDF7);
  --panel: rgba(255,255,255,.74); --barra: linear-gradient(180deg, #F1F3FE, #E4E9FB); --linea: #B7C1EC; --linea-suave: #D4DAF4;
  --tenue: #575C93; --neon: #F27FA3; --neon-borde: #E8668F; --neon-suave: #FFE6EE; --texto: #3E4380; --tinta: #2B2F66; --sobre-neon: #2A2D52;
  --lienzo: #FBFAFF; --rejilla: #ECEAFB; --cero: #D9D3F6; --onda: #DCD4FA; --alto: #7A63E0; --ve: #7A63E0; --cabezal: #5BBFEF; --salto: #F27FA3;
  --umbral: #F27FA3; --ambar: #D9962A; --nota: #3D8FC6; --tecla: #FFFFFF; --negra: #3E4380; --brillo: rgba(242,127,163,.35);
  --radio: 14px; --radio-btn: 9px; --pista: #D6DBF4; --boton: #FFFFFF;
  --sombra-panel: 0 8px 24px rgba(72,76,150,.12), 0 1px 0 rgba(255,255,255,.9) inset; --sombra-btn: 0 1px 2px rgba(72,76,150,.12);
  --f-marca: 'Silkscreen', 'Courier New', monospace;
  --f-etiqueta: 'IBM Plex Sans', system-ui, sans-serif;
  --f-numero: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --f-texto: 'IBM Plex Sans', system-ui, sans-serif;
  --k-num: .72;
  --borde: 1.5px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo-img), var(--fondo); color: var(--texto); font-family: var(--f-texto); font-size: 12px; line-height: 1.35; overflow-x: hidden; }
body[data-piel="neli"] { --tenue: #575C93; }
body.en-ventana { --fondo-img: none; }

<script>
// fraseo.js — el fraseo de miaus: una frase escrita → un maullido real de Neli por palabra, enteros y sin tocar.
// Se eligen con selección de unidades (Viterbi de segundo orden): que cada uno pegue con el anterior y calce con su lugar.
// Es la misma regla que frasear.py; las pruebas comparan los dos. Corre en el navegador y en Node.
(function (raiz) {
  'use strict';
  const ATONAS = new Set(['el','la','los','las','un','una','me','te','se','le','les','lo','nos','y','o','de','del','a','al','en','que','por','con','mi','tu','su','es','no','si']);
  const V = 'aeiouáéíóúü';
  const nsil = (p) => Math.max(1, (p.match(new RegExp('[' + V + ']+', 'g')) || []).length);
  const log2 = (x) => Math.log(x) / Math.LN2;
  // la frase → palabras y pausas, con lo que pide cada lugar
  function plan(frase) {
    const preg = frase.includes('?'), excl = frase.includes('!'), susp = frase.includes('…') || frase.includes('...');
    const toks = frase.toLowerCase().match(/[\wáéíóúüñ]+|\.\.\.|…|[,;:.]/g) || [];
    const out = [];
    for (const t of toks) {
      if (t === ',' || t === ';' || t === ':') { out.push({ pausa: .45 }); continue; }
      if (t === '.' || t === '...' || t === '…') { out.push({ pausa: .9 }); continue; }
      out.push({ pal: t, sil: nsil(t), atona: ATONAS.has(t) });
    }
    const pals = out.filter((o) => o.pal), N = pals.length;
    pals.forEach((o, i) => { o.pos = i / Math.max(1, N - 1); o.ult = i === N - 1; o.prim = i === 0; });
    return { plan: out, preg, excl, susp };
  }
  // qué tan bien calza un maullido con lo que pide ese lugar de la frase
  function costoDestino(r, o, preg, excl, susp) {
    let c = 0;
    const quiere = o.atona ? .30 : ({ 1: .38, 2: .46 }[o.sil] || .56);          // largo según sílabas
    c += Math.pow(Math.abs(r.dur - quiere) / .1, 2) * 0.6;
    let objetivo = 12 * log2(820 / 440) + (1.5 - 3.0 * o.pos);                   // la frase parte aguda y baja 3 st
    if (preg && o.ult) objetivo += 3;
    c += Math.pow((r.st_max + r.st_min) / 2 - objetivo, 2) * 0.25;
    if (o.ult) {
      if (preg) c += r.forma === 'sube' ? 0 : (r.forma === 'valle' || r.forma === 'plano') ? 3 : 6;
      else c += ((r.forma === 'baja' || r.forma === 'arco') && r.st_fin < r.st_ini) ? 0 : 4;
    }
    if (o.prim && r.forma === 'baja') c += 4;
    if (excl) c += Math.pow(r.ataque_ms / 100, 2) * 0.5 + (r.f0_med > 780 ? 0 : 2);
    if (susp) c += r.dur > .5 ? 0 : 2;
    return c;
  }
  // qué tan bien pega el final de uno con el principio del otro
  function costoUnion(a, b) {
    const salto = Math.abs(b.st_ini - a.st_fin);
    let c = Math.pow(salto / 2.5, 2) + Math.pow(Math.abs(b.centroide - a.centroide) / 700, 2) * 0.5;
    if (a.n === b.n) c += 100;
    return c;
  }
  // la mejor cadena completa: Viterbi con estado (anterior, actual), castigando repetir el de dos lugares atrás
  // opciones.evitar: por lugar, los maullidos que ya se usaron en otras versiones (se castigan, no se prohíben)
  function elegir(frase, R, opciones) {
    const evitar = (opciones && opciones.evitar) || [];
    const { plan: P, preg, excl, susp } = plan(frase);
    const slots = P.filter((o) => o.pal), K = R.length, L = slots.length;
    if (!L) return { plan: P, preg, excl, costo: 0 };
    const D = slots.map((o, i) => R.map((r) => costoDestino(r, o, preg, excl, susp) + ((evitar[i] || []).includes(r.n) ? 4 : 0)));
    const U = R.map((a) => R.map((b) => costoUnion(a, b)));
    let sel, costo;
    if (L === 1) {
      let k = 0; for (let i = 1; i < K; i++) if (D[0][i] < D[0][k]) k = i;
      sel = [k]; costo = D[0][k];
    } else {
      let acc = R.map((_, p) => R.map((_, c) => D[0][p] + U[p][c] + D[1][c]));   // acc[p][c]
      const backs = [];
      for (let i = 2; i < L; i++) {
        const nuevo = R.map(() => new Array(K).fill(Infinity)), bk = R.map(() => new Array(K).fill(0));
        for (let c = 0; c < K; c++) for (let p = 0; p < K; p++) {
          let mejor = Infinity, arg = 0;
          for (let pp = 0; pp < K; pp++) {
            const v = acc[pp][p] + U[p][c] + D[i][c] + (pp === c ? 6 : 0);
            if (v < mejor) { mejor = v; arg = pp; }
          }
          nuevo[p][c] = mejor; bk[p][c] = arg;
        }
        backs.push(bk); acc = nuevo;
      }
      let p = 0, c = 0; costo = Infinity;
      for (let i = 0; i < K; i++) for (let j = 0; j < K; j++) if (acc[i][j] < costo) { costo = acc[i][j]; p = i; c = j; }
      sel = [c, p];
      for (let i = backs.length - 1; i >= 0; i--) { const pp = backs[i][p][c]; sel.push(pp); c = p; p = pp; }
      sel.reverse();
    }
    slots.forEach((o, i) => { o.n = R[sel[i]].n; o.r = R[sel[i]]; });
    return { plan: P, preg, excl, costo };
  }
  // un número fijo por palabra, para que el hueco varíe un pelo pero siempre igual para la misma palabra
  function semilla(s) { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 1000003; return h; }
  // la frase como lista de piezas con su instante: [{ t, n, pal }…] y el largo total (segundos)
  function armar(frase, R, opciones) {
    const { plan: P, preg, excl, costo } = elegir(frase, R, opciones);
    const piezas = []; let t = .05, prev = null;
    for (const o of P) {
      if (o.pausa) { t += o.pausa; prev = null; continue; }
      if (prev) t += opciones && opciones.pegado ? -.02 : (excl ? .09 : (o.atona || prev.atona) ? .14 : .2) + .03 * ((semilla(o.pal) % 5) / 4);   // pegados: 20 ms montados (la cola de uno con la entrada del otro)
      piezas.push({ t: +t.toFixed(4), n: o.n, pal: o.pal, dur: o.r.dur, forma: o.r.forma, ini: o.r.f0_ini, fin: o.r.f0_fin });
      t += o.r.dur; prev = o;
    }
    const saltos = piezas.slice(1).map((p, i) => +(12 * log2(p.ini / piezas[i].fin)).toFixed(1));
    return { piezas, largo: +(t + .25).toFixed(3), saltos, preg, excl, costo };
  }
  raiz.fraseoMiau = { plan, elegir, armar, nsil, ATONAS };
})(typeof module !== 'undefined' ? module.exports : window);

</script>
<script>
(() => {
  'use strict';
  /* Miau v01: escribes una frase y Neli la dice con sus maullidos de verdad, uno por palabra, enteros y sin tocar.
     Las reglas de elección están en fraseo.js (las mismas que frasear.py). Aquí: la pantalla, el sonido, la salida por cable.
     Dentro de NeliOS usa el motor de audio del escritorio; sola, el suyo. */
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const dec = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',').replace('-', '−');
  const miles = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const leerLS = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const guardarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const compartido = (() => { try { return window.parent !== window && window.parent.neliAudio ? window.parent.neliAudio : null; } catch (e) { return null; } })();
  const R = window.MIAU_MEDIDAS;                       // los 23 maullidos medidos (lo pone armar.py)
  const RUTA = window.MIAU_RUTA || 'audios/';          // dónde están los .wav (en el artefacto vienen incrustados en MIAU_AUDIOS)
  const EJEMPLOS = ['hola barti', '¿tienes hambre?', '¡no me toques!', 'ven… tengo sueño.', 'barti, ¿me abres la puerta?'];

  // ---------- el motor: los 23 maullidos decodificados, una salida con volumen, el analizador y el cable ----------
  let ctx = null, salida = null, directo = null, ana = null, cargando = null; const buf = {};
  let conDirecto = true;
  async function motor() {
    if (ctx) { if (ctx.state === 'suspended') await ctx.resume(); return true; }
    if (cargando) return cargando;
    cargando = (async () => {
      try {
        ctx = compartido ? compartido.ctx() : new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        if (ctx.state === 'suspended') await ctx.resume();
        salida = ctx.createGain(); directo = ctx.createGain(); directo.gain.value = conDirecto ? 1 : 0; ana = ctx.createAnalyser(); ana.fftSize = 1024;
        salida.connect(directo); directo.connect(ctx.destination); salida.connect(ana);
        await cargarAudios(ctx);
        if (compartido) compartido.registrar('miau', { salida: () => salida, arrancar: motor, apagar });
        return true;
      } catch (e) { decir('No pude encender el audio (' + esc(e.name || e.message || e) + '). Toca la ventana y prueba de nuevo.'); ctx = null; return false; }
      finally { cargando = null; }
    })();
    return cargando;
  }
  const bytesDe = b64 => { const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; };
  async function cargarAudios(c) {
    await Promise.all(R.map(async r => {
      if (buf[r.n]) return;
      const datos = window.MIAU_AUDIOS ? bytesDe(window.MIAU_AUDIOS[r.n].split(',')[1]) : await (await fetch(RUTA + 'neli_miau_' + r.n + '.wav')).arrayBuffer();
      buf[r.n] = await c.decodeAudioData(datos);
    }));
  }

  // ---------- decir una frase: elegir, dibujar y sonar ----------
  let actual = null, versiones = [], sonando = null, pegado = leerLS('miau.pegado', false);
  async function decirFrase(frase, otra) {
    frase = (frase || '').trim(); if (!frase) return;
    if (!otra) versiones = [];
    const a = fraseoMiau.armar(frase, R, { evitar: versiones, pegado });
    if (!a.piezas.length) { decir('Escribe alguna palabra.'); return; }
    versiones = a.piezas.map((p, i) => (versiones[i] || []).concat(p.n));
    actual = Object.assign({ frase }, a); guardarLS('miau.frase', frase);
    pintarFrase(); pintarAdentro(); $('bWav').disabled = false; $('bOtra').disabled = false;
    await sonar();
  }
  async function sonar() {
    if (!actual || !(await motor())) return;
    parar();
    const t0 = ctx.currentTime + .05, fuentes = [];
    for (const p of actual.piezas) { const s = ctx.createBufferSource(); s.buffer = buf[p.n]; s.connect(salida); s.start(t0 + p.t); fuentes.push(s); }
    sonando = { t0, fuentes, fin: t0 + actual.largo };
    fuentes[fuentes.length - 1].onended = () => { if (sonando && sonando.fuentes === fuentes) { sonando = null; marcar(-1); } };
    $('bDecir').setAttribute('aria-pressed', 'true');
  }
  function parar() { if (!sonando) return; for (const s of sonando.fuentes) { try { s.stop(); } catch (e) {} } sonando = null; marcar(-1); }
  // la palabra que está sonando se ilumina
  function marcar(i) { document.querySelectorAll('.miau').forEach((el, k) => el.classList.toggle('suena', k === i)); if (i < 0) $('bDecir').setAttribute('aria-pressed', 'false'); }
  function cualSuena() {
    if (!sonando || !actual) return -1; const t = ctx.currentTime - sonando.t0;
    for (let i = actual.piezas.length - 1; i >= 0; i--) { const p = actual.piezas[i]; if (t >= p.t && t < p.t + p.dur) return i; }
    return -1;
  }
  // un maullido solo (tocar su bloque)
  async function sonarUno(n) { if (!(await motor())) return; parar(); const s = ctx.createBufferSource(); s.buffer = buf[n]; s.connect(salida); s.start(); }

  // ---------- la frase en pantalla: cada palabra con el bloque de su maullido y la curva de tono adentro ----------
  const curvaSVG = r => {                                 // la curva medida (20 puntos, semitonos): se dibuja respecto a 800 Hz, ±8 st
    const ref = 12 * Math.log2(800 / 440), pts = r.curva.map((v, i) => (6 + i / 19 * 54).toFixed(1) + ',' + (27 - (v - ref) / 8 * 20).toFixed(1));
    return '<svg class="curvas" viewBox="0 0 66 54" aria-hidden="true"><line class="eje" x1="6" y1="27" x2="60" y2="27"/><polyline class="curva" points="' + pts.join(' ') + '"/></svg>';
  };
  function pintarFrase() {
    const f = $('frase'); f.replaceChildren();
    const P = fraseoMiau.plan(actual.frase).plan; let k = 0;
    for (const o of P) {
      if (o.pausa) { const d = document.createElement('div'); d.className = 'palabra'; d.innerHTML = '<div class="pausa" title="pausa de ' + Math.round(o.pausa * 1000) + ' ms">' + (o.pausa > .5 ? '.' : ',') + '</div><span class="texto">&nbsp;</span>'; f.append(d); continue; }
      const p = actual.piezas[k++], r = R.find(x => x.n === p.n);
      const d = document.createElement('div'); d.className = 'palabra';
      d.innerHTML = '<button type="button" class="miau" title="maullido ' + r.n + ': ' + r.forma + ', ' + r.f0_ini + ' → ' + r.f0_max + ' → ' + r.f0_fin + ' Hz, ' + dec(r.dur, 2) + ' s. Toca para oírlo solo" aria-label="' + esc(p.pal) + ': maullido ' + r.n + '">' +
        '<svg class="orejas" viewBox="0 0 66 9" preserveAspectRatio="none"><path d="M9 9 L15 1 L24 7Z"/><path d="M57 9 L51 1 L42 7Z"/></svg>' + curvaSVG(r) + '<span class="n">' + r.n + '</span><span class="forma">' + r.forma + '</span></button>' +
        '<span class="texto">' + esc(p.pal) + '</span>';
      d.querySelector('.miau').addEventListener('click', () => sonarUno(p.n));
      f.append(d);
    }
  }

  // ---------- por dentro: la frase en el tiempo (cada maullido con su curva de tono en Hz) y los números ----------
  const lz = $('lienzo'), g2 = lz.getContext('2d'); let W = 160, H = 60, S = 2;
  function medirLienzo() {
    const caja = $('adDibujo'), cw = caja.clientWidth, ch = caja.clientHeight; if (!cw || !ch) return;
    S = Math.max(2, Math.min(4, Math.floor(Math.min(cw / 150, ch / 55)))); W = Math.floor(cw / S); H = Math.floor(ch / S);
    lz.width = W; lz.height = H; lz.style.width = W * S + 'px'; lz.style.height = H * S + 'px'; lz.style.left = Math.floor((cw - W * S) / 2) + 'px'; lz.style.top = Math.floor((ch - H * S) / 2) + 'px';
    pintarLienzo();
  }
  addEventListener('resize', medirLienzo);
  const VERDE = '#6CFFA8', AZUL = '#4CC9FF', ROSA = '#FF6B8B', OSCURO = '#0E2A1C', MEDIO = '#2F5E45';
  function pintarLienzo() {
    g2.fillStyle = '#050807'; g2.fillRect(0, 0, W, H); if (!actual) return;
    const x0 = 3, x1 = W - 3, ya = 4, yb = H - 5, L = actual.largo, px = t => Math.round(x0 + t / L * (x1 - x0));
    const st = hz => 12 * Math.log2(hz / 800), py = s => Math.round(yb - (s + 8) / 16 * (yb - ya));   // ±8 st alrededor de 800 Hz
    g2.fillStyle = OSCURO; g2.fillRect(x0, py(0), x1 - x0, 1);                                           // 800 Hz
    const cual = cualSuena();
    actual.piezas.forEach((p, i) => {
      const r = R.find(x => x.n === p.n), a = px(p.t), b = px(p.t + p.dur), ref = 12 * Math.log2(800 / 440);
      g2.fillStyle = i === cual ? '#163A28' : '#0B1A12'; g2.fillRect(a, ya, Math.max(1, b - a), yb - ya);
      g2.fillStyle = i === cual ? VERDE : AZUL;
      for (let x = a; x <= b; x++) { const f = (x - a) / Math.max(1, b - a), v = r.curva[Math.min(19, Math.round(f * 19))] - ref; g2.fillRect(x, py(v), 1, 1); }
      if (i) {                                                                                             // el salto desde el anterior, en rosado
        const q = actual.piezas[i - 1], ysal = py(st(q.fin)), yent = py(st(p.ini)), xa = px(q.t + q.dur), lo = Math.min(ysal, yent), hi = Math.max(ysal, yent);
        g2.fillStyle = ROSA; g2.fillRect(xa, lo, 1, Math.max(1, hi - lo)); g2.fillRect(xa, yent, Math.max(1, a - xa), 1);
      }
    });
    if (sonando) { const x = px(ctx.currentTime - sonando.t0); if (x >= x0 && x <= x1) { g2.fillStyle = VERDE; g2.fillRect(x, ya - 2, 1, yb - ya + 4); } }
  }
  function pintarAdentro() {
    const a = actual, n = a.piezas.length, lect = [];
    $('adTit').textContent = 'por dentro · ' + n + (n === 1 ? ' maullido' : ' maullidos') + ' · ' + dec(a.largo, 1) + ' s';
    lect.push(a.piezas.map(p => '<b>' + p.n + '</b>').join(' → ') + (a.preg ? ' <i>(pregunta: el último sube)</i>' : a.excl ? ' <i>(grito: entran rápido)</i>' : ''));
    if (a.saltos.length) { const peor = Math.max(...a.saltos.map(Math.abs)); lect.push('saltos de tono entre uno y otro: ' + a.saltos.map(s => (s > 0 ? '+' : '') + dec(s, 1)).join(' · ') + ' st' + (peor <= 2.5 ? ' (todos dentro de lo natural: Neli salta 2,5)' : ' <i>(uno se pasa de 2,5)</i>')); }
    const huecos = a.piezas.slice(1).map((p, i) => Math.round((p.t - a.piezas[i].t - a.piezas[i].dur) * 1000)); if (huecos.length) lect.push(pegado ? 'pegados: cada uno entra 20 ms antes de que el anterior termine de apagarse' : 'huecos: ' + huecos.join(' · ') + ' ms');
    lect.push('tono: parte en ' + a.piezas[0].ini + ' Hz, termina en ' + a.piezas[n - 1].fin + ' Hz' + (n > 1 ? ' (' + (a.piezas[n - 1].fin < a.piezas[0].ini ? 'baja' : 'sube') + ', como una frase)' : ''));
    lect.push('maullidos enteros, sin cambiar tono ni largo. costo de la elección: ' + dec(a.costo, 1));
    $('lect').innerHTML = lect.map(l => '<p>' + l + '</p>').join('');
    pintarLienzo();
  }
  (function cuadro() { requestAnimationFrame(cuadro); if (sonando && !document.hidden) { marcar(cualSuena()); pintarLienzo(); } })();

  // ---------- bajar como .wav (sin tiempo real, con el mismo fraseo) ----------
  async function bajar() {
    if (!actual || !(await motor())) return;
    const sr = 48000, oc = new OfflineAudioContext(1, Math.ceil(actual.largo * sr), sr), bufs = {};
    for (const r of R) if (!bufs[r.n]) { const b = buf[r.n], c = oc.createBuffer(1, b.length, b.sampleRate); c.copyToChannel(b.getChannelData(0), 0); bufs[r.n] = c; }
    for (const p of actual.piezas) { const s = oc.createBufferSource(); s.buffer = bufs[p.n]; s.connect(oc.destination); s.start(p.t); }
    const y = (await oc.startRendering()).getChannelData(0), n = y.length, v = new DataView(new ArrayBuffer(44 + n * 2)), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) { const x = Math.max(-1, Math.min(1, y[i])); v.setInt16(44 + i * 2, x < 0 ? x * 32768 : x * 32767, true); }
    const url = URL.createObjectURL(new Blob([v.buffer], { type: 'audio/wav' })), a = document.createElement('a');
    a.href = url; a.download = 'neli-dice-' + actual.frase.toLowerCase().replace(/[^a-záéíóúüñ0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) + '.wav'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 30000);
    decir('<b>' + esc(a.download) + '</b>: ' + miles(n) + ' números × 2 + 44 = ' + miles(44 + n * 2) + ' bytes.');
  }
  function decir(h) { $('lect').innerHTML = '<p>' + h + '</p>'; }

  // ---------- la pantalla ----------
  $('fDecir').addEventListener('submit', e => { e.preventDefault(); decirFrase($('texto').value); });
  $('bWav').addEventListener('click', bajar);
  $('bOtra').addEventListener('click', () => decirFrase(actual.frase, true));
  $('bPegado').setAttribute('aria-pressed', pegado ? 'true' : 'false');
  $('bPegado').addEventListener('click', () => { pegado = !pegado; guardarLS('miau.pegado', pegado); $('bPegado').setAttribute('aria-pressed', pegado ? 'true' : 'false'); if (actual) { versiones = versiones.map(v => v.slice(0, -1)); decirFrase(actual.frase, true); } });
  for (const f of EJEMPLOS) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip chico'; b.textContent = f; b.addEventListener('click', () => { $('texto').value = f; decirFrase(f); }); $('ejemplos').append(b); }
  addEventListener('keydown', e => { if (e.key === 'Escape') parar(); });
  const ponerPiel = () => { let v = 'neli'; try { v = localStorage.getItem('meowdacity.piel') || 'neli'; } catch (e) {} document.body.dataset.piel = v === 'terminal' ? 'terminal' : 'neli'; };
  addEventListener('storage', e => { if (e.key === 'meowdacity.piel') ponerPiel(); });

  // ---------- NeliOS: el cable de salida, la patita ----------
  let aId = null, aNombre = '';
  function pintarRuta() { $('ruta').innerHTML = aId ? '<span class="etq">sale a</span> <b>' + esc(aNombre) + '</b>' + (conDirecto ? ' y los parlantes' : '') : (compartido ? '<span class="etq">sale a</span> los parlantes · enchufa la salida en la Grabadora para grabarla' : ''); }
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return;
    const d = e.data; if (!d || typeof d.nelios !== 'string') return;
    if (d.nelios === 'cursor') {
      if (typeof d.patita === 'string' && d.patita.startsWith('data:image/')) { document.documentElement.style.setProperty('--patita', 'url(' + d.patita + ') 4 2'); document.body.classList.add('patita'); }
      else document.body.classList.remove('patita');
    }
    if (d.nelios === 'cable') {
      aId = d.salida || null; aNombre = d.salidaNombre || ''; conDirecto = d.directo !== false;
      if (directo && ctx) { const t = ctx.currentTime; directo.gain.cancelScheduledValues(t); directo.gain.setValueAtTime(directo.gain.value, t); directo.gain.linearRampToValueAtTime(conDirecto ? 1 : 0, t + .02); }
      pintarRuta();
    }
  });
  function apagar() { try { parar(); if (salida) salida.disconnect(); if (directo) directo.disconnect(); } catch (e) {} }
  addEventListener('pagehide', apagar);

  // ---------- partir ----------
  ponerPiel(); pintarRuta(); medirLienzo();
  const ultima = leerLS('miau.frase', ''); if (ultima) { $('texto').value = ultima; }
  motor();   // los audios se cargan de entrada (1 MB); el contexto se enciende con el primer clic si el navegador lo exige
  window.__miau = { pegado: () => pegado, actual: () => actual, decir: decirFrase, sonar, ctx: () => ctx, ana: () => ana, buf, R, listo: () => Object.keys(buf).length === R.length, salida: () => salida, directo: () => conDirecto };
})();

</script>
