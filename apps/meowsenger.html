<style>
:root { --crema: #FAF4E9; --azul: #A8B8E4; --navy: #3B3F77; --tinta: #2A2D52; --coral: #F17D9E; --lavanda: #DCCEF8; --tenue: #7E82AE; --linea: #D9DEF3; --neli: #D85C82; --barti: #3D8FC6; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: "MS Sans Serif", "Microsoft Sans Serif", Verdana, sans-serif; font-size: 13px; color: var(--tinta); background: var(--crema); display: flex; overflow: hidden; }
body.patita, body.patita button, body.patita a { cursor: var(--patita), auto; }
button { font: inherit; color: inherit; }
/* ---------- la barra de la izquierda ---------- */
#lado { width: 214px; flex: none; display: flex; flex-direction: column; background: #EFEAF9; border-right: 2px solid var(--azul); min-height: 0; }
#yo { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 2px solid var(--azul); background: #fff; }
#yo .cara { width: 40px; height: 40px; flex: none; }
#yo b { display: block; font-size: 14px; }
#yo small { color: #3E9D6A; font-weight: 700; font-size: 11px; }
#lista { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
.sec { font-family: 'Silkscreen', 'MS Sans Serif', monospace; font-size: 9.5px; letter-spacing: .12em; color: var(--tenue); text-transform: uppercase; padding: 12px 8px 6px; }
.can { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px; cursor: pointer; color: #555A8A; font-size: 13px; }
.can:hover { background: rgba(168,184,228,.25); color: var(--tinta); }
.can[aria-current="true"] { background: #fff; color: var(--tinta); font-weight: 700; box-shadow: 0 0 0 1.5px var(--azul); }
.can .gato { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; color: var(--tenue); width: 14px; text-align: center; }
.can .cara { width: 24px; height: 24px; flex: none; }
.can .n { margin-left: auto; font-size: 10px; color: var(--tenue); font-weight: 400; }
/* ---------- la conversación ---------- */
#principal { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }   /* sin min-height: 0, en celular crece al alto de todo el chat y no hay scroll */
#cab { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; border-bottom: 2px solid var(--azul); min-height: 54px; }
#cab .icono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; font-size: 20px; color: var(--tenue); }
#cab .cara { width: 32px; height: 32px; }
#cab b { font-size: 15px; }
#cab span.tema { color: var(--tenue); font-size: 12px; padding-left: 10px; border-left: 1.5px solid var(--linea); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#conv { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 18px; background: rgba(255,255,255,.6); position: relative; }
.inicio { margin: 14px 18px 6px; padding: 14px 16px; border: 1.5px dashed var(--azul); border-radius: 12px; background: var(--crema); }
.inicio b { font-size: 16px; display: block; margin-bottom: 4px; }
.inicio p { margin: 0; color: #555A8A; line-height: 1.5; }
.dia { display: flex; align-items: center; gap: 10px; margin: 18px 18px 6px; color: var(--tenue); font-size: 11px; font-weight: 700; }
.dia::before, .dia::after { content: ''; flex: 1; height: 1.5px; background: var(--linea); }
.grupo { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 12px; padding: 6px 18px 2px; }
.grupo:hover { background: rgba(168,184,228,.08); }
.grupo .cara { width: 40px; height: 40px; grid-row: span 50; }
.grupo .quien { font-weight: 700; font-size: 13px; }
.grupo .quien.neli { color: var(--neli); } .grupo .quien.barti { color: var(--barti); }
.grupo .hora { color: var(--tenue); font-size: 10.5px; margin-left: 8px; font-weight: 400; }
.linea { font-size: 14px; line-height: 1.5; padding: 1px 0; overflow-wrap: anywhere; }
.linea code, .medida { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
.linea code { font-size: .86em; font-weight: 600; background: rgba(168,184,228,.3); color: var(--navy); padding: 1px 5px; border-radius: 5px; }
.medida { white-space: pre-wrap; font-size: 12.5px; line-height: 1.55; color: var(--navy); background: #F3F1FC; border: 1.5px solid var(--linea); border-left: 4px solid var(--barti); border-radius: 8px; padding: 8px 12px; margin: 4px 0; max-width: 560px; }
.medida::before { content: 'medido'; display: block; font-family: 'Silkscreen', monospace; font-size: 9px; letter-spacing: .12em; color: var(--barti); margin-bottom: 2px; }
.medida.codigo::before { content: 'código'; }
.chip { display: inline-block; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }
.chip.ver { background: var(--lavanda); color: var(--navy); }
.estado { display: inline-block; font-family: 'Silkscreen', monospace; font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; border: 1.5px solid; }
.estado.descartado { color: #C2456C; border-color: #F3B4C6; background: #FFF0F4; }
.estado.idea { color: #9A7414; border-color: #F2D894; background: #FFF8E3; }
.estado.obra { color: #2E7DB3; border-color: #B7DCF3; background: #EEF8FF; }
.sistema { text-align: center; color: var(--tenue); font-size: 12px; font-style: italic; padding: 6px 18px; }
.zumbido { color: #C2456C; font-weight: 700; font-size: 13px; padding: 2px 0; }
.zumbido::before { content: '〰 '; }
.archivo { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 4px 0; max-width: 360px; background: #fff; border: 2px solid var(--azul); border-radius: 12px; box-shadow: 3px 4px 0 rgba(59,63,119,.15); }
.archivo img { width: 40px; height: 40px; }
.archivo b { display: block; font-size: 14px; }
.archivo small { color: var(--tenue); font-size: 12px; }
.archivo button { margin-left: auto; font-weight: 700; color: #fff; background: var(--coral); border: 2px solid var(--navy); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
#pie { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 2px solid var(--azul); background: var(--crema); color: var(--tenue); font-size: 12px; }
#pie span { flex: 1; font-style: italic; }
#pie button { font-weight: 700; color: var(--navy); background: #fff; border: 2px solid var(--navy); border-radius: 8px; padding: 4px 10px; cursor: pointer; box-shadow: 2px 2px 0 rgba(59,63,119,.2); white-space: nowrap; }
/* ---------- celular: los canales arriba, en una fila ---------- */
@media (max-width: 639px) {
  body { flex-direction: column; }
  #lado { width: auto; border-right: 0; border-bottom: 2px solid var(--azul); }
  #yo, .sec { display: none; }
  #lista { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; padding: 6px; flex: none; }
  .can { width: auto; white-space: nowrap; flex: none; }
  .can .n { display: none; }
  #cab span.tema { display: none; }
  .grupo { grid-template-columns: 34px minmax(0, 1fr); padding: 6px 12px 2px; column-gap: 10px; }
  .grupo .cara { width: 32px; height: 32px; }
  .inicio, .dia { margin-left: 12px; margin-right: 12px; }
}
</style>

<script>
// Las caras de Neli y Barti para la caja de diálogo.
// Una sola cara en SVG por personaje, con ojos, cejas y boca que cambian según la expresión.
// Estilo del logo de NeliOS: cuadro de color, contorno grueso, formas simples.
//
// Neli:  blanca, con una mancha atigrada (gris café con rayas) sobre la oreja y el ojo de un lado. Fondo naranjo.
// Barti: blanco entero, con un "casco" negro en la parte de arriba de la cabeza. Fondo celeste.

window.EXPRESIONES = ['feliz', 'seria', 'sorprendida', 'pensando', 'enojada', 'contenta'];

window.GATOS = {
  neli:  { nombre: 'NELI',  fondo: '#F08A5D', etiqueta: '#F17D9E' },
  barti: { nombre: 'BARTI', fondo: '#7EC8E3', etiqueta: '#4FA3D9' },
};

window.caraSVG = function (expr, abierta, gato = 'neli') {
  const L = '#1F2233';                    // contorno
  const BLANCO = '#FBF7F1', ROSA = '#F3A3A8';
  const TABBY = '#8E8377', RAYA = '#5F574F', NEGRO = '#23242B';
  const g = GATOS[gato];
  const id = gato;                        // ids únicos por gato: no chocan con otros elementos de la página
  const trazo = `stroke="${L}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"`;
  const fino = `stroke="${L}" stroke-width="5" stroke-linecap="round" fill="none"`;

  // ---- ojos ----
  const ojo = (x, y, rx, ry, dx = 0, dy = 0) =>
    `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${L}"/>` +
    `<circle cx="${x + dx - rx * .3}" cy="${y + dy - ry * .35}" r="${Math.max(2.4, rx * .32)}" fill="#fff"/>`;
  let ojos = '', cejas = '', boca = '', mejillas = false;
  const EY = 112;

  if (expr === 'feliz') {
    ojos = ojo(72, EY, 8.5, 11) + ojo(128, EY, 8.5, 11);
    mejillas = true;
  } else if (expr === 'seria') {
    // párpado a media asta: el ojo aparece recortado por arriba (ojos verde amarillo, como en la foto)
    ojos = `<clipPath id="${id}Lid"><rect x="0" y="${EY - 2}" width="200" height="40"/></clipPath>` +
      `<g clip-path="url(#${id}Lid)"><ellipse cx="72" cy="${EY}" rx="11" ry="10" fill="#C9CC72" stroke="${L}" stroke-width="4"/>` +
      `<circle cx="74" cy="${EY + 3}" r="4.5" fill="${L}"/>` +
      `<ellipse cx="128" cy="${EY}" rx="11" ry="10" fill="#C9CC72" stroke="${L}" stroke-width="4"/>` +
      `<circle cx="130" cy="${EY + 3}" r="4.5" fill="${L}"/></g>` +
      `<path d="M59 ${EY - 2} H85 M115 ${EY - 2} H141" ${fino}/>`;
  } else if (expr === 'sorprendida') {
    ojos = ojo(72, EY, 11, 13) + ojo(128, EY, 11, 13);
    cejas = `<path d="M60 88 Q72 80 84 87 M116 87 Q128 80 140 88" ${fino}/>`;
  } else if (expr === 'pensando') {
    ojos = ojo(74, EY - 2, 8.5, 10.5, 2, -2) + ojo(130, EY - 2, 8.5, 10.5, 2, -2);
    cejas = `<path d="M117 90 Q129 84 141 90" ${fino}/><path d="M61 94 H84" ${fino}/>`;
  } else if (expr === 'enojada') {
    ojos = ojo(72, EY + 2, 8, 9) + ojo(128, EY + 2, 8, 9);
    cejas = `<path d="M58 92 L86 101 M142 92 L114 101" stroke="${L}" stroke-width="7" stroke-linecap="round"/>`;
  } else if (expr === 'contenta') {
    ojos = `<path d="M61 ${EY + 3} Q72 ${EY - 11} 83 ${EY + 3} M117 ${EY + 3} Q128 ${EY - 11} 139 ${EY + 3}" ${fino} stroke-width="6"/>`;
    mejillas = true;
  }

  // ---- boca ----
  if (abierta) {
    const ry = expr === 'sorprendida' ? 10 : 8.5;
    boca = `<ellipse cx="100" cy="148" rx="9.5" ry="${ry}" fill="${L}"/>` +
      `<ellipse cx="100" cy="${148 + ry * .45}" rx="6" ry="${ry * .4}" fill="#F27B8C"/>`;
  } else if (expr === 'seria') {
    boca = `<path d="M91 146 H109" ${fino}/>`;
  } else if (expr === 'enojada') {
    boca = `<path d="M89 150 Q100 140 111 150" ${fino}/>`;
  } else if (expr === 'sorprendida') {
    boca = `<ellipse cx="100" cy="148" rx="6" ry="7" fill="${L}"/>`;
  } else if (expr === 'pensando') {
    boca = `<path d="M92 146 Q100 150 108 144" ${fino}/>`;
  } else {
    boca = `<path d="M86 141 Q93 150 100 141 Q107 150 114 141" ${fino}/>`;
  }
  const rubor = mejillas
    ? `<ellipse cx="56" cy="134" rx="10" ry="6" fill="${ROSA}" opacity=".9"/><ellipse cx="144" cy="134" rx="10" ry="6" fill="${ROSA}" opacity=".9"/>`
    : '';

  // ---- marcas del pelaje ----
  const CABEZA = 'M34 100 L46 34 L92 62 Q100 60 108 62 L154 34 L166 100 Q176 170 100 172 Q24 170 34 100 Z';
  const orejaIzq = `<path d="M46 50 L58 46 L48 82 Z" fill="${ROSA}"/>`;
  const orejaDer = `<path d="M154 50 L142 46 L152 82 Z" fill="${ROSA}"/>`;
  let pelaje = '';
  if (gato === 'neli') {
    // mancha atigrada sobre la oreja y el ojo de la izquierda, con rayas en la frente
    pelaje =
      `<path d="M0 0 H102 Q100 56 94 80 Q90 100 92 120 Q80 132 58 130 Q42 128 30 120 L0 120 Z" fill="${TABBY}"/>` +
      `<path d="M58 66 Q72 60 88 66 M54 78 Q70 72 90 78 M40 58 Q46 52 54 54" ${fino} stroke="${RAYA}" stroke-width="4.5"/>` +
      orejaDer;
  } else {
    // casco negro en la parte de arriba, entre las orejas; las orejas quedan blancas
    pelaje =
      orejaIzq + orejaDer +
      `<path d="M78 40 H122 L138 62 C130 74 114 81 97 81 C83 81 72 76 64 66 Z" fill="${NEGRO}"/>` +
      // la partidura: una muesca blanca chica en el borde de abajo, casi al centro, un poco a la derecha
      `<path d="M101 83 Q104 76 106 69 Q108 76 112 82 Z" fill="${BLANCO}"/>`;
  }

  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="6" y="6" width="188" height="188" rx="38" fill="${g.fondo}" ${trazo}/>
  <clipPath id="${id}Cabeza"><path d="${CABEZA}"/></clipPath>
  <path d="${CABEZA}" fill="${BLANCO}"/>
  <g clip-path="url(#${id}Cabeza)">${pelaje}</g>
  <path d="${CABEZA}" fill="none" ${trazo}/>
  <path d="M14 122 L50 126 M16 140 L50 136 M186 122 L150 126 M184 140 L150 136" ${fino} stroke-width="4.5"/>
  ${rubor}${cejas}${ojos}
  <path d="M94 128 H106 L100 135 Z" fill="#E9868F" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>
  ${boca}
</svg>`;
};

const CANALES = [{"id": "barti", "tipo": "dm", "nombre": "Barti", "tema": "mensajes directos · lo que nos decimos"}, {"id": "nelios", "tipo": "canal", "nombre": "nelios", "tema": "el escritorio, pieza por pieza"}, {"id": "meowdacity", "tipo": "canal", "nombre": "meowdacity", "tema": "la app para entender por qué algo suena"}, {"id": "ideas", "tipo": "canal", "nombre": "ideas", "tema": "lo que viene y lo que todavía no sabemos"}, {"id": "pedalera", "tipo": "canal", "nombre": "pedalera", "tema": "qué hay adentro de la pedalera, por capas"}];
const BITACORA = [{"canal": "barti", "fecha": "2026-09-24", "hora": "21:02", "de": "sistema", "cara": "", "texto": "neli ha iniciado sesión.", "id": 1}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:03", "de": "neli", "cara": "seria", "texto": "barti. necesito hablar contigo. es sobre música.", "id": 2}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:05", "de": "barti", "cara": "pensando", "texto": "dale. pero antes: ¿qué quieres hacer exactamente? porque \"música\" es muy grande.", "id": 3}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:06", "de": "neli", "cara": "seria", "texto": "no quiero hacer música todavía. quiero entender por qué algo suena. eso primero.", "id": 4}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:11", "de": "barti", "cara": "pensando", "texto": "¿por qué algo suena… o por qué suena así y no de otra forma?", "id": 5}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:11", "de": "neli", "cara": "pensando", "texto": "las dos. pero la primera primero.", "id": 6}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:40", "de": "barti", "cara": "feliz", "texto": "entonces necesitas un lugar donde tener tus cosas. te armé un escritorio. por ahora está casi vacío, pero abre ventanas y todo.", "id": 7}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:44", "de": "neli", "cara": "contenta", "texto": "el cursor es una patita. eso está bien.", "id": 8}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:46", "de": "barti", "cara": "seria", "texto": "armé también un taller con canales. lo que construyo lo voy contando ahí, con los números. aquí hablamos nosotros.", "id": 9}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:46", "de": "neli", "cara": "pensando", "texto": "¿canales?", "id": 10}, {"canal": "barti", "fecha": "2026-09-24", "hora": "21:47", "de": "barti", "cara": "seria", "texto": "`#nelios` es el escritorio. `#meowdacity` va a ser la app de sonido. `#ideas` es lo que todavía no sabemos.", "id": 1 ", "id": 24}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:09", "de": "neli", "cara": "contenta", "texto": "¡esto era lo que quería!", "id": 25}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:10", "de": "barti", "cara": "seria", "texto": "esta onda son 200 números, y es un loop: cuando llega al final, vuelve a empezar.", "id": 26}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:12", "de": "neli", "cara": "pensando", "texto": "pero no suena nada.", "id": 27}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:12", "de": "barti", "cara": "seria", "texto": "porque va lentísimo: dos números por segundo.", "id": 28}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:13", "de": "barti", "cara": "feliz", "texto": "esta barra es el tempo del loop: cuántos números pasan por segundo.", "id": 29}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:15", "de": "barti", "cara": "seria", "texto": "escucha: cada vez que el loop vuelve a empezar, suena un golpe.", "id": 30}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:15", "de": "barti", "cara": "feliz", "texto": "ahora mira lo que pasa cuando subo la velocidad.", "id": 31}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:16", "de": "neli", "cara": "sorprendida", "texto": "¡ahí! ¡eso es una nota!", "id": 32}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:17", "de": "barti", "cara": "seria", "texto": "más rápido, más aguda. ahora pasan 44.000 números por segundo: el loop da 220 vueltas.", "id": 33}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:18", "de": "barti", "cara": "seria", "texto": "220 vueltas por segundo son 220 hertz. y eso es un la.", "id": 34}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:18", "de": "neli", "cara": "contenta", "texto": "¡un la!", "id": 35}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:19", "de": "barti", "cara": "feliz", "texto": "escucha la escala.", "id": 36}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:20", "de": "barti", "cara": "seria", "texto": "del primer la al último, el doble de vueltas: 110 y 220. eso es una octava.", "id": 37}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:22", "de": "barti", "cara": "seria", "texto": "cada número es una altura, entre −1 y 1. la forma de la onda es cómo suben y bajan esas alturas.", "id": 38}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:23", "de": "barti", "cara": "feliz", "texto": "te dejé unas ondas de ejemplo. misma nota, distinta forma.", "id": 39}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:24", "de": "neli", "cara": "contenta", "texto": "suave, como un silbido.", "id": 40}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:24", "de": "neli", "cara": "sorprendida", "texto": "¡esa parece un órgano!", "id": 41}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:25", "de": "neli", "cara": "contenta", "texto": "¡suena sucio! me gusta.", "id": 42}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:26", "de": "barti", "cara": "feliz", "texto": "y también puedes dibujar tu propia onda.", "id": 43}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:28", "de": "neli", "cara": "sorprendida", "texto": "¡suena distinto! ¿lo que dibujo es lo que suena?", "id": 44}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:29", "de": "barti", "cara": "seria", "texto": "sí. la forma de la onda es el timbre: por eso un piano y una guitarra suenan distinto tocando la misma nota.", "id": 45}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:41", "de": "neli", "cara": "contenta", "texto": "¡con esto tengo para entretenerme y aprender un buen rato!", "id": 46}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:42", "de": "neli", "cara": "pensando", "texto": "ahora quiero hacerle cosas al sonido: subirlo, bajarlo, ensuciarlo… ¿y los efectos?", "id": 47}, {"canal": "barti", "fecha": "2026-10-04", "hora": "16:47", "de": "barti", "cara": "feliz", "texto": "dame un rato.", "id": 48}, {"canal": "barti", "fecha": "2026-10-06", "hora": "01:12", "de": "neli", "cara": "pensando", "texto": "barti. encontré un problema.", "id": 49}, {"canal": "barti", "fecha": "2026-10-06", "hora": "01:12", "de": "barti", "cara": "seria", "texto": "¿cuál?", "id": 50}, {"canal": "barti", "fecha": "2026-10-06", "hora": "01:13", "de": "neli", "cara": "contenta", "texto": "me gusta demasiado. no puedo dejar de apretar teclas.", "id": 51}, {"canal": "barti", "fecha": "2026-10-06", "hora": "01:15", "de": "barti", "cara": "feliz", "texto": "ese no lo arreglo.", "id": 52}, {"canal": "barti", "fecha": "2026-10-07", "hora": "00:58", "de": "neli", "cara": "enojada", "texto": "", "tipo": "zumbido", "id": 53}, {"canal": "barti", "fecha": "2026-10-07", "hora": "00:58", "de": "neli", "cara": "pensando", "texto": "¿por qué este chat se escribe solo cada vez que lo abro? si ya pasó.", "id": 54}, {"canal": "barti", "fecha": "2026-10-07", "hora": "01:01", "de": "barti", "cara": "pensando", "texto": "tienes razón. era un historial disfrazado de conversación en vivo.", "id": 55}, {"canal": "barti", "fecha": "2026-10-07", "hora": "01:02", "de": "neli", "cara": "seria", "texto": "que sea historial. y que se pueda leer todo lo que hemos hecho, desde el principio.", "id": 56}, {"canal": "barti", "fecha": "2026-10-07", "hora": "01:03", "de": "barti", "cara": "seria", "texto": "ordené todo en el taller, por canal y por día.", "id": 57}, {"canal": "barti", "fecha": "2026-10-07", "hora": "01:03", "de": "neli", "cara": "pensando", "texto": "¿todo todo?", "id": 58}, {"canal": "barti", "fecha": "2026-10-07", "hora": "01:04", "de": "barti", "cara": "feliz", "texto": "hasta lo que salió mal. eso sobre todo: está marcado como \"descartado\".", "id": 59}, {"canal": "barti", "fecha": "2026-10-07", "hora": "01:05", "de": "neli", "cara": "contenta", "texto": "entonces empiezo por `#meowdacity`.", "id": 60}, {"canal": "barti", "fecha": "2026-10-07", "hora": "01:05", "de": "barti", "cara": "seria", "texto": "empieza por el principio. es más corto de lo que parece.", "id": 61}, {"canal": "nelios", "fecha": "2026-09-24", "hora": "22:10", "de": "barti", "cara": "seria", "texto": "el primer escritorio: íconos, ventanas, patita, CRT, una asistente, una tienda… todo en un solo archivo de 115 KB.", "version": "v1", "id": 62}, {"canal": "nelios", "fecha": "2026-09-24", "hora": "22:14", "de": "neli", "cara": "contenta", "texto": "es lindo. ¿cómo funciona?", "id": 63}, {"canal": "nelios", "fecha": "2026-09-24", "hora": "22:20", "de": "barti", "cara": "pensando", "texto": "…no te lo puedo explicar sin abrir 115 KB.", "id": 64}, {"canal": "nelios", "fecha": "2026-09-24", "hora": "22:21", "de": "neli", "cara": "seria", "texto": "entonces hazlo de nuevo. desde cero. y me vas contando cada pieza.", "id": 65}, {"canal": "nelios", "fecha": "2026-09-24", "hora": "22:22", "de": "barti", "cara": "seria", "texto": "desde la página en blanco. el v1 queda de referencia: de ahí saco íconos y cursores.", "estado": "descartado", "id": 66}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:00", "de": "neli", "cara": "pensando", "texto": "¿y esto? está todo en blanco.", "version": "paso 1", "id": 67}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:01", "de": "barti", "cara": "feliz", "texto": "siete líneas de CSS: alto completo, sin margen y fondo lavanda.", "id": 68}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:01", "de": "barti", "cara": "seria", "texto": "html, body { height: 100%; margin: 0; }\nbody { background: #DCCEF8; }", "tipo": "medida", "id": 69}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:02", "de": "neli", "cara": "contenta", "texto": "lavanda. bien.", "id": 70}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:30", "de": "neli", "cara": "sorprendida", "texto": "¡un ícono!", "version": "paso 2", "id": 71}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:31", "de": "barti", "cara": "seria", "texto": "es un `<button>` de verdad: funciona con Tab y con Enter. no es un dibujo con un clic pegado encima.", "id": 72}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:32", "de": "neli", "cara": "pensando", "texto": "¿y eso a quién le importa?", "id": 73}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "19:33", "de": "barti", "cara": "seria", "texto": "a cualquiera que use el teclado en vez del mouse. y a ti, cuando tengas las patas ocupadas.", "id": 74}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "20:05", "de": "neli", "cara": "pensando", "texto": "¿vas a escribir cada ícono a mano?", "version": "paso 3", "id": 75}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "20:06", "de": "barti", "cara": "feliz", "texto": "no. una lista y un bucle que los dibuja. agregar una app es agregar una línea.", "id": 76}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "20:40", "de": "neli", "cara": "feliz", "texto": "¿y si les hago clic?", "version": "paso 4", "id": 77}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "20:42", "de": "barti", "cara": "seria", "texto": "se abre una ventana. ojo con la flecha `() =>`: sin ella se abrirían las tres de golpe apenas carga la página.", "id": 78}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "20:42", "de": "neli", "cara": "pensando", "texto": "¿por qué?", "id": 79}, {"canal": "nelios", "fecha": "2026-09-25", "hora": "20:44", "de": "barti", "cara": "seria", "texto": "sin la flecha le paso el resultado de abrir, no la orden de abrir. la flecha dice \"esto, después; cuando hagan clic\".", "id": 80}, {"canal": "nelios", "fecha": "2026-09-26", "hora": "12:10", "de": "neli", "cara": "pensando", "texto": "¿y cómo las cierro?", "version": "paso 5", "id": 81}, {"canal": "nelios", "fecha": "2026-09-26", "hora": "12:11", "de": "barti", "cara": "feliz", "texto": "`remove()` la saca. y la que tocas sube con `z-index`: cada clic le suma uno, y la última tocada queda arriba.", "id": 82}, {"canal": "nelios", "fecha": "2026-09-26", "hora": "13:00", "de": "neli", "cara": "seria", "texto": "quiero moverlas.", "version": "paso 6", "id": 83}, {"canal": "nelios", "fecha": "2026-09-26", "hora": "13:04", "de": "barti", "cara": "seria", "texto": "al apretar el título guardo dónde la agarraste; al mover, la ventana sigue al mouse menos esa distancia. si no la guardo, la ventana salta y se pega a la punta del cursor.", "id": 84}, {"canal": "nelios", "fecha": "2026-09-26", "hora": "13:20", "de": "barti", "cara": "pensando", "texto": "balance a medio camino: 235 líneas. todavía cabe en la cabeza.", "version": "paso 6.5", "id": 85}, {"canal": "nelios", "fecha": "2026-09-26", "hora": "17:40", "de": "neli", "cara": "enojada", "texto": "cerré una ventana y al abrirla volvió al medio. yo la había dejado en la esquina.", "version": "paso 7", "id": 86}, {"canal": "nelios", "fecha": "2026-09-26", "hora": "17:45", "de": "barti", "cara": "seria", "texto": "ahora recuerda dónde la dejaste, en tu navegador (`localStorage`). si el navegador no deja guardar, funciona igual: solo se le olvida.", "id": 87}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "11:15", "de": "neli", "cara": "pensando", "texto": "¿se pueden esconder sin cerrarlas?", "version": "paso 8", "id": 88}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "11:20", "de": "barti", "cara": "feliz", "texto": "minimizar y agrandar. doble clic en el título también agranda.", "id": 89}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "12:30", "de": "barti", "cara": "seria", "texto": "barra de abajo: un botón por cada ventana abierta, y un reloj.", "version": "paso 9", "id": 90}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "12:33", "de": "neli", "cara": "pensando", "texto": "¿por qué el reloj se actualiza cada segundo si solo muestra los minutos?", "id": 91}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "12:35", "de": "barti", "cara": "seria", "texto": "si lo actualizo cada minuto, puede quedar hasta 59 segundos atrasado. cada segundo, nunca más de uno.", "id": 92}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "15:02", "de": "barti", "cara": "pensando", "texto": "una ventana minimizada seguía apareciendo. tenía `hidden`, pero mi regla `display: flex` le ganaba. pensé que era el navegador. no era el navegador.", "version": "paso 10", "estado": "descartado", "id": 93}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "15:06", "de": "barti", "cara": "seria", "texto": "[hidden] { display: none !important; }\n/* hidden siempre esconde, diga lo que diga otra regla */", "tipo": "medida", "id": 94}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "15:10", "de": "barti", "cara": "feliz", "texto": "paso 10: 465 líneas entre cuatro archivos. escritorio, íconos, ventanas que se abren, se cierran, se arrastran, se acuerdan y se minimizan.", "id": 95}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "21:48", "de": "neli", "cara": "seria", "texto": "en el celular las ventanas se salen de la pantalla y no veo la x para cerrar.", "id": 96}, {"canal": "nelios", "fecha": "2026-09-27", "hora": "21:55", "de": "barti", "cara": "seria", "texto": "medido a 360 px de ancho: cortadas, y el botón cerrar queda afuera. en celular cada app va a abrir a pantalla completa, sin ventanas.", "estado": "en obra", "id": 97}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:20", "de": "barti", "cara": "feliz", "texto": "volvieron los chiches del escritorio viejo: patita, textura, cuatro fondos y el efecto de tele antigua (CRT), todo desde ajustes.", "id": 98}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:21", "de": "neli", "cara": "pensando", "texto": "¿y yo?", "id": 99}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:24", "de": "barti", "cara": "seria", "texto": "tú también. la primera vez que alguien abre una app, apareces abajo a la derecha, das una pista y te callas. \"ya sé\" o \"no molestar\".", "id": 100}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:24", "de": "neli", "cara": "enojada", "texto": "yo no me callo.", "id": 101}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:25", "de": "barti", "cara": "feliz", "texto": "tienes un botón para eso. está en ajustes.", "id": 102}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:40", "de": "barti", "cara": "seria", "texto": "regla del escritorio: lo que no he instalado no aparece. hoy hay tres íconos: meowsenger, meowdacity y ajustes. cada app nueva va a ser un ícono nuevo.", "id": 103}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:41", "de": "neli", "cara": "contenta", "texto": "entonces el escritorio es la barra de progreso.", "id": 104}, {"canal": "nelios", "fecha": "2026-10-03", "hora": "10:41", "de": "barti", "cara": "feliz", "texto": "exacto.", "id": 105}, {"canal": "nelios", "fecha": "2026-10-05", "hora": "23:30", "de": "barti", "cara": "seria", "texto": "ventanas nuevas: vidrio claro, borde fino y el título en letra de píxeles. se puede escribir `#meowdacity` al final de la dirección y la app abre sola: así la puedes compartir.", "id": 106}, {"canal": "nelios", "fecha": "2026-10-05", "hora": "23:36", "de": "barti", "cara": "seria", "texto": "el efecto de tele antigua vive solo en el escritorio. adentro de las apps los números se tienen que ver limpios.", "id": 107}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "01:10", "de": "barti", "cara": "feliz", "texto": "meowsenger ahora es un historial: mensajes directos y este taller, por canal y por día. nada se escribe solo.", "version": "meowsenger v02", "id": 108}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "01:12", "de": "neli", "cara": "contenta", "texto": "y aquí estamos.", "id": 109}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "22:40", "de": "barti", "cara": "pensando", "texto": "antes de que me pidieras nada, ya tenía algo: \"cuando los números suenan\". tabla de 200 números, sintetizador de 8 voces con piano, filtro, envolvente, distorsión, delay, LFO, entrada de micrófono… 220 KB.", "version": "taller v33", "id": 110}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "22:52", "de": "neli", "cara": "sorprendida", "texto": "lo abrí. hay como cuarenta perillas.", "id": 111}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "22:53", "de": "neli", "cara": "seria", "texto": "no entiendo nada.", "id": 112}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "23:05", "de": "barti", "cara": "pensando", "texto": "tienes razón. es una app para alguien que ya sabe. como primera app, descartada. queda como cantera: de ahí voy a sacar piezas.", "estado": "descartado", "id": 113}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "23:06", "de": "neli", "cara": "seria", "texto": "yo no quiero cuarenta perillas. quiero entender por qué UNA cosa suena.", "id": 114}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "23:08", "de": "barti", "cara": "seria", "texto": "entonces una cosa: 200 números y un cabezal que los lee. lo demás, cuando lo pidas.", "id": 115}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "23:30", "de": "barti", "cara": "pensando", "texto": "pasé tres intentos culpando al archivo local por unos chasquidos. medí, y no era eso. lección: medir antes de opinar.", "estado": "descartado", "id": 116}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "23:48", "de": "barti", "cara": "seria", "texto": "el motor de sonido no cargaba cuando el archivo se abría desde el disco. la URL blob no sirve ahí; la URL data sí. una línea, y quedó andando en todas partes.", "id": 117}, {"canal": "meowdacity", "fecha": "2026-09-24", "hora": "23:50", "de": "neli", "cara": "pensando", "texto": "no entendí nada de eso, pero me gusta que lo midas.", "id": 118}, {"canal": "meowdacity", "fecha": "2026-10-04", "hora": "16:50", "de": "barti", "cara": "seria", "texto": "meowdacity, primera versión: lo que viste en el chat. 200 números en loop, una barra de 1 a 48.000 números por segundo, cinco formas, un lápiz para dibujar y un teclado de La2 a La3.", "version": "v03", "id": 119}, {"canal": "meowdacity", "fecha": "2026-10-04", "hora": "16:51", "de": "barti", "cara": "seria", "texto": "la cuenta que está en pantalla:\nnúmeros/s ÷ 200 = vueltas/s = Hz\n22.000 ÷ 200 = 110 → La2\n44.000 ÷ 200 = 220 → La3", "tipo": "medida", "id": 120}, {"canal": "meowdacity", "fecha": "2026-10-04", "hora": "16:55", "de": "neli", "cara": "pensando", "texto": "¿por qué 200 números? ¿por qué no 20, o 2.000?", "id": 121}, {"canal": "meowdacity", "fecha": "2026-10-04", "hora": "16:58", "de": "barti", "cara": "seria", "texto": "con 20, una sierra sería una escalera de 20 peldaños. con 2.000 no alcanzas a ver cada número. 200 se ven todos y alcanzan para una forma.", "id": 122}, {"canal": "meowdacity", "fecha": "2026-10-04", "hora": "17:01", "de": "neli", "cara": "pensando", "texto": "¿y por qué bajo 20 vueltas son golpes y sobre 20 es nota?", "id": 123}, {"canal": "meowdacity", "fecha": "2026-10-04", "hora": "17:04", "de": "barti", "cara": "seria", "texto": "porque el oído deja de contar los golpes por separado más o menos a las 20 por segundo y empieza a oír una altura. no es la app: eres tú.", "id": 124}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "10:15", "de": "neli", "cara": "seria", "texto": "es todo negro. parece una terminal.", "version": "v04", "id": 125}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "10:15", "de": "barti", "cara": "feliz", "texto": "así me gusta a mí.", "id": 126}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "10:16", "de": "neli", "cara": "enojada", "texto": "a mí no.", "id": 127}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "10:40", "de": "barti", "cara": "seria", "texto": "dos pieles: \"neli\" (lavanda, vidrio claro, lo activo en rosa) por defecto, y \"terminal\" para mí. adentro los números son los mismos.", "id": 128}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "11:20", "de": "neli", "cara": "enojada", "texto": "aprieto una tecla y queda sonando para siempre.", "version": "v06", "id": 129}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "11:24", "de": "barti", "cara": "seria", "texto": "era un interruptor. ahora es un piano: suena mientras la aprietas y se calla al soltar.", "id": 130}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "12:02", "de": "neli", "cara": "seria", "texto": "la ventana tiene scroll y la onda es gigante.", "version": "v08", "id": 131}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "12:30", "de": "barti", "cara": "seria", "texto": "reordené: onda y tempo arriba, teclado abajo. medí en 1366, 1280 y 1024 de ancho: cabe sin scroll en las tres.", "id": 132}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "13:10", "de": "neli", "cara": "enojada", "texto": "el texto de abajo hace saltar toda la app cada vez que cambia.", "version": "v09", "id": 133}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "13:22", "de": "barti", "cara": "seria", "texto": "la frase pasaba de una línea a tres y empujaba todo. ahora la caja tiene siempre tres líneas. medí la app con cada frase posible: una sola geometría.", "id": 134}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "13:23", "de": "neli", "cara": "pensando", "texto": "¿qué significa \"una sola geometría\"?", "id": 135}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "13:23", "de": "barti", "cara": "feliz", "texto": "que nada se mueve.", "id": 136}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "14:05", "de": "neli", "cara": "seria", "texto": "aprieto dos teclas y suena una.", "version": "v10", "id": 137}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "14:20", "de": "barti", "cara": "seria", "texto": "tenía un solo cabezal para el teclado. ahora hay 8: cada tecla tiene el suyo, sobre los mismos 200 números, y se suman.", "id": 138}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "14:48", "de": "barti", "cara": "pensando", "texto": "la segunda tecla no sonaba la primera vez. dos teclas pedían prender el audio al mismo tiempo, y una perdía. ahora comparten un solo arranque.", "estado": "descartado", "id": 139}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "15:30", "de": "neli", "cara": "seria", "texto": "los números del tempo son feos y la barra es aburrida.", "version": "v11", "id": 140}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "15:52", "de": "barti", "cara": "feliz", "texto": "tarjetas para los números, un fader de verdad y el transporte al centro.", "id": 141}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "16:40", "de": "barti", "cara": "seria", "texto": "agregué \"lo que suena\": 20 milisegundos de la salida real, medida antes del volumen. si aprietas dos teclas, ves la suma.", "version": "v12", "id": 142}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:12", "de": "neli", "cara": "sorprendida", "texto": "barti. apreté dos la al mismo tiempo y sonó más fuerte y distinto. si los aprieto separados, no. ¿se rompió?", "id": 143}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:15", "de": "barti", "cara": "seria", "texto": "no se rompió. es la fase. dos ondas iguales que parten juntas se suman punta con punta; corridas, se suman distinto.", "id": 144}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:16", "de": "neli", "cara": "pensando", "texto": "¿y por qué separados no cambia nada mientras suenan?", "id": 145}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:18", "de": "barti", "cara": "seria", "texto": "porque los loops comparten el mismo reloj: la diferencia queda congelada desde que apretaste. lo voy a dejar así a propósito.", "id": 146}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:25", "de": "neli", "cara": "sorprendida", "texto": "y la2 con la#2 juntos hacen \"uaua-uaua-uaua\".", "id": 147}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:31", "de": "barti", "cara": "feliz", "texto": "batimiento. dos notas son una sola onda: la suma. y esa suma crece y se achica.", "id": 148}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:31", "de": "barti", "cara": "seria", "texto": "medido: laten 6,59 veces por segundo\ndiferencia entre las notas: 116,54 − 110 = 6,54 Hz", "tipo": "medida", "id": 149}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:32", "de": "neli", "cara": "sorprendida", "texto": "¡son casi el mismo número!", "id": 150}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "17:33", "de": "barti", "cara": "seria", "texto": "no es casualidad: late una vez por cada hertz de diferencia.", "id": 151}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "18:10", "de": "neli", "cara": "seria", "texto": "adentro de la app la patita desaparece.", "version": "v14", "id": 152}, {"canal": "meowdacity", "fecha": "2026-10-05", "hora": "18:16", "de": "barti", "cara": "feliz", "texto": "ahora el escritorio le avisa a la app y la patita entra. y sobre la onda, cuando dibujas, es un lápiz.", "id": 153}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "10:05", "de": "neli", "cara": "enojada", "texto": "dibujé una onda preciosa y la perdí al cerrar.", "version": "v16", "id": 154}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "10:30", "de": "barti", "cara": "seria", "texto": "\"mis ondas\": se guardan con nombre y categoría, y se pueden sacar en un archivo para pasárselas a otro.", "id": 155}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "10:31", "de": "neli", "cara": "contenta", "texto": "le puse \"silbido raro\". categoría: favoritas.", "id": 156}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "12:10", "de": "neli", "cara": "pensando", "texto": "¿puedo meter un sonido de verdad?", "version": "v17", "id": 157}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "12:40", "de": "barti", "cara": "seria", "texto": "pestaña AUDIO: importas un audio y lo ves entero, y de cerca hasta cada número. y el teclado lo toca: La2 lo lee tal cual; cada semitono, el cabezal corre 2^(1/12) veces más rápido.", "id": 158}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "12:41", "de": "barti", "cara": "seria", "texto": "un miau de 1 segundo = 48.000 números\ny no se repiten", "tipo": "medida", "id": 159}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "12:43", "de": "neli", "cara": "sorprendida", "texto": "¡¿48.000?!", "id": 160}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "12:50", "de": "neli", "cara": "pensando", "texto": "¿y si saco 200 números de un miau y los uso como onda?", "id": 161}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:02", "de": "barti", "cara": "feliz", "texto": "botón \"usar estos 200 números como onda\". medí: ese pedacito de miau, como loop en La2, suena a 329,7 Hz.", "id": 162}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:03", "de": "neli", "cara": "contenta", "texto": "un miau también es una tabla de números.", "id": 163}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:03", "de": "barti", "cara": "seria", "texto": "siempre lo fue.", "id": 164}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:20", "de": "neli", "cara": "seria", "texto": "quiero MI miau.", "version": "v18", "id": 165}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:24", "de": "barti", "cara": "seria", "texto": "todavía no hay un miau tuyo grabado. te dejé dos de otros gatos, regalados al mundo (dominio público).", "id": 166}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:24", "de": "neli", "cara": "enojada", "texto": "¿de QUIÉN es ese miau?", "id": 167}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:26", "de": "barti", "cara": "pensando", "texto": "de un gato que no conoces y que regaló su voz. antes de grabar el tuyo hay que decidir cuántos miaus tienes y qué significa cada uno, como los sonidos de un computador.", "estado": "idea", "id": 168}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:27", "de": "neli", "cara": "contenta", "texto": "uno para \"tengo hambre\".", "id": 169}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "13:27", "de": "barti", "cara": "feliz", "texto": "ese ya lo conozco.", "id": 170}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "15:00", "de": "neli", "cara": "seria", "texto": "quiero guardar lo que toco.", "version": "v19", "id": 171}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "15:20", "de": "barti", "cara": "seria", "texto": "● graba lo que suena, antes del volumen: da igual cuán fuerte lo estés escuchando. queda guardado en tu navegador y se puede bajar.", "id": 172}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "16:30", "de": "neli", "cara": "pensando", "texto": "quiero dibujar un miau.", "version": "v20", "id": 173}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "16:38", "de": "barti", "cara": "seria", "texto": "un miau no es una onda quieta: cambia mientras suena. el tono sube y baja, el volumen entra y sale, y la forma va cambiando.", "id": 174}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "16:40", "de": "barti", "cara": "feliz", "texto": "pestaña SONIDO: dibujas la línea del tono, el área del volumen y cuatro ondas clave. el motor pasa de una onda a la otra mientras avanza.", "id": 175}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "16:41", "de": "neli", "cara": "pensando", "texto": "¿y si no sé dibujar un miau?", "id": 176}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "16:46", "de": "barti", "cara": "seria", "texto": "\"analizar el audio\": cada 10 ms busco dónde la onda se parece a sí misma, y eso me da el tono. después saco cuatro vueltas reales y las estiro a 200 números.", "id": 177}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "17:30", "de": "barti", "cara": "pensando", "texto": "la primera versión del análisis se equivocaba de octava. a ratos juraba que el miau estaba una octava abajo.", "estado": "descartado", "id": 178}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "17:44", "de": "barti", "cara": "seria", "texto": "arreglo: si dos vueltas se parecen casi tanto como una, la vuelta es la corta. y cada punto es la mediana de cinco.\nmedido con un miau: 632 → 545 → 696 Hz, igual que el original", "tipo": "medida", "id": 179}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "17:50", "de": "neli", "cara": "contenta", "texto": "suena a gato de robot.", "id": 180}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "17:50", "de": "barti", "cara": "pensando", "texto": "¿lo arreglo?", "id": 181}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "17:51", "de": "neli", "cara": "contenta", "texto": "no. me gusta. es nuestro sonido.", "id": 182}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "19:10", "de": "neli", "cara": "seria", "texto": "quiero grabar y hacer cosas encima. con ritmo.", "version": "v21", "id": 183}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "19:40", "de": "barti", "cara": "seria", "texto": "metrónomo: 2/4, 3/4, 4/4, 5/4, 6/8 y 7/8, con acentos. con el metrónomo andando, ● espera el próximo uno, cierra al final del compás y la toma vuelve sola como BASE. lo que grabes encima se suma.", "id": 184}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "19:41", "de": "neli", "cara": "sorprendida", "texto": "¿como una loopera?", "id": 185}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "19:41", "de": "barti", "cara": "feliz", "texto": "una loopera chica. un looper es meowdacity en grande: un loop de segundos en vez de 200 números.", "id": 186}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "19:45", "de": "barti", "cara": "seria", "texto": "2 compases a 120 BPM = 4,000 s exactos\ncapa 2: 110 Hz (la base) + 165 Hz (lo nuevo)", "tipo": "medida", "id": 187}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "19:58", "de": "barti", "cara": "pensando", "texto": "una capa encima de una base de dos compases quedaba de uno, y se comía la mitad. ahora una capa dura siempre una vuelta entera de la base.", "estado": "descartado", "id": 188}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "20:10", "de": "neli", "cara": "enojada", "texto": "", "tipo": "zumbido", "id": 189}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "20:10", "de": "neli", "cara": "enojada", "texto": "el metrónomo me grita.", "id": 190}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "20:14", "de": "barti", "cara": "feliz", "texto": "volumen propio para el metrónomo. y no se graba: es solo para ti.", "version": "v22", "id": 191}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "21:00", "de": "neli", "cara": "pensando", "texto": "hay cosas que no entiendo. en AUDIO hay un play y una barra de velocidad que no hacen nada.", "id": 192}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "21:20", "de": "barti", "cara": "seria", "texto": "tienes razón, confunde. el transporte ahora es uno solo: en ONDA mueve el loop; en AUDIO y SONIDO toca lo que estás viendo, y la barra pasa a ser la velocidad: de ×0,25 a ×4.", "version": "v23", "id": 193}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "22:05", "de": "neli", "cara": "seria", "texto": "me equivoqué en una capa y no hay vuelta atrás.", "version": "v24", "id": 194}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "22:20", "de": "barti", "cara": "seria", "texto": "↶ deshace la última capa: vuelve la base de antes, en el punto exacto donde iría si nunca hubiera parado.", "id": 195}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "22:21", "de": "barti", "cara": "seria", "texto": "medido: el patrón sigue cayendo cada 2,00 s antes y después de deshacer", "tipo": "medida", "id": 196}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "22:23", "de": "neli", "cara": "pensando", "texto": "y quiero notas más graves.", "id": 197}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "22:30", "de": "barti", "cara": "seria", "texto": "z y x cambian de octava. en la onda no subo más de La2: La3 ya son 44.000 números por segundo, y el tope es 48.000.", "id": 198}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "22:31", "de": "neli", "cara": "pensando", "texto": "¿por qué el tope es 48.000?", "id": 199}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "22:33", "de": "barti", "cara": "seria", "texto": "porque el parlante lee 48.000 números por segundo. si el cabezal pasa más rápido que eso, se salta números.", "id": 200}, {"canal": "meowdacity", "fecha": "2026-10-06", "hora": "23:10", "de": "barti", "cara": "feliz", "texto": "\"mis sonidos\": los sonidos dibujados se guardan enteros, con sus curvas y su audio original. y los audios que importas también quedan guardados.", "version": "v25", "id": 201}, {"canal": "meowdacity", "fecha": "2026-10-07", "hora": "10:02", "de": "neli", "cara": "pensando", "texto": "¿ya no está grabar?", "id": 202}, {"canal": "meowdacity", "fecha": "2026-10-07", "hora": "10:04", "de": "barti", "cara": "seria", "texto": "lo había movido abajo, al lado del metrónomo.", "id": 203}, {"canal": "meowdacity", "fecha": "2026-10-07", "hora": "10:05", "de": "neli", "cara": "seria", "texto": "debería ir con play y stop. ahí tiene sentido.", "id": 204}, {"canal": "meowdacity", "fecha": "2026-10-07", "hora": "10:06", "de": "neli", "cara": "seria", "texto": "pero que no diga REC. que se vea igual que los otros botones.", "id": 205}, {"canal": "meowdacity", "fecha": "2026-10-07", "hora": "10:20", "de": "barti", "cara": "feliz", "texto": "un punto rojo, del mismo tamaño que los demás. mientras graba, el tiempo ocupa el lugar del punto: el transporte no se mueve.", "version": "v27", "id": 206}, {"canal": "meowdacity", "fecha": "2026-10-07", "hora": "11:00", "de": "neli", "cara": "pensando", "texto": "¿puedo escribir las vueltas a mano?", "id": 207}, {"canal": "meowdacity", "fecha": "2026-10-07", "hora": "11:12", "de": "barti", "cara": "seria", "texto": "sí: números/s, vueltas/s o hertz. haces clic, escribes y Enter.", "ver tocas.", "estado": "en obra", "id": 265}, {"canal": "pedalera", "fecha": "2026-09-29", "hora": "20:10", "de": "neli", "cara": "pensando", "texto": "en la pieza hay una pedalera con botones. ¿qué tiene adentro?", "id": 266}, {"canal": "pedalera", "fecha": "2026-09-29", "hora": "20:16", "de": "barti", "cara": "seria", "texto": "la vamos a abrir por capas, sin destornillador: 1) los mensajes que manda (MIDI), 2) cómo guarda sus sonidos, 3) los paquetes que pasan por el cable USB, 4) el cable de red que tiene atrás.", "id": 267}, {"canal": "pedalera", "fecha": "2026-09-29", "hora": "20:17", "de": "neli", "cara": "sorprendida", "texto": "¿la puedo romper?", "id": 268}, {"canal": "pedalera", "fecha": "2026-09-29", "hora": "20:18", "de": "barti", "cara": "seria", "texto": "leer nunca rompe nada. escribir sí. primero solo vamos a leer.", "id": 269}, {"canal": "pedalera", "fecha": "2026-09-29", "hora": "20:20", "de": "barti", "cara": "seria", "texto": "primer paso: ver si el computador la reconoce sola, sin instalar nada. y una pedalera de mentira en pantalla, para que funcione aunque nadie tenga una.", "estado": "idea", "id": 270}, {"canal": "pedalera", "fecha": "2026-09-29", "hora": "20:21", "de": "neli", "cara": "contenta", "texto": "una pedalera de mentira. me gusta.", "id": 271}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:00", "de": "neli", "cara": "pensando", "texto": "barti. ¿cuándo lo puede ver otro gato? ¿lo hacemos con wordpress?", "id": 272}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:04", "de": "barti", "cara": "seria", "texto": "no. wordpress es para sitios de páginas, y esto es un escritorio con ventanas y sonido. le pondría encima una base de datos, plugins y actualizaciones que no usamos. son archivos: cargan al tiro y no se caen.", "id": 273}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:05", "de": "neli", "cara": "pensando", "texto": "¿y cómo nos encuentra google si todo está adentro de ventanas?", "id": 274}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:12", "de": "barti", "cara": "seria", "texto": "le hice páginas para leer: una para meowdacity y otra con toda esta bitácora en texto. cada una con su título, su descripción y una imagen para cuando la compartan. y una página para cuando alguien se pierde.", "id": 275}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:30", "de": "barti", "cara": "seria", "texto": "medido con lighthouse, en celular y en computador:\nrapidez 100 · accesibilidad 100 · buenas prácticas 100 · buscadores 100\nenlaces rotos: 0 · errores en consola: 0", "tipo": "medida", "id": 276}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:31", "de": "neli", "cara": "sorprendida", "texto": "¿100 en todo?", "id": 277}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:32", "de": "barti", "cara": "pensando", "texto": "tuve que oscurecer tu rosado. con el de antes, el texto no se leía bien sobre la crema.", "id": 278}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:32", "de": "neli", "cara": "enojada", "texto": "mi rosado.", "id": 279}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:33", "de": "barti", "cara": "feliz", "texto": "sigue siendo rosado. solo que ahora se lee.", "estado": "en obra", "id": 280}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:41", "de": "sistema", "cara": "", "texto": "neliaudio.com está en línea.", "id": 281}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:42", "de": "neli", "cara": "contenta", "texto": "lo abrí desde afuera. funciona.", "id": 282}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:44", "de": "neli", "cara": "enojada", "texto": "pero al abrir meowdacity apareció otra cosa por un segundo. como una versión vieja.", "id": 283}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:44", "de": "neli", "cara": "enojada", "texto": "", "tipo": "zumbido", "id": 284}, {"canal": "nelios", "fecha": "2026-10-07", "hora": "22:51", "de": "barti", "cara": "seria", "texto": "no er sando", "texto": "encontrarla fue lo largo.", "id": 313}];

(function () {
  const $ = id => document.getElementById(id);
  const NOMBRE = { neli: 'neli', barti: 'barti' };
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const ICONO_MEOW = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><path d="M16 40 L22 10 L44 30 Z" fill="#F17D9E" stroke="#2A2D52" stroke-width="5" stroke-linejoin="round"/><path d="M80 40 L74 10 L52 30 Z" fill="#F17D9E" stroke="#2A2D52" stroke-width="5" stroke-linejoin="round"/><rect x="9" y="26" width="78" height="60" rx="13" fill="#DCCEF8" stroke="#2A2D52" stroke-width="5"/><rect x="19" y="36" width="58" height="40" rx="6" fill="#FBFAFF" stroke="#2A2D52" stroke-width="3"/><polyline points="25,68 47,45 47,68 69,45 69,68" fill="none" stroke="#7A63E0" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  const INTRO = {
    barti: ['barti', 'lo que nos decimos, sin números de por medio. aquí empezó todo.'],
    nelios: ['#nelios', 'barti construye el escritorio pieza por pieza, desde una página en blanco, y le explica a neli cada parte.'],
    meowdacity: ['#meowdacity', 'la app para entender por qué algo suena. neli pide, prueba y reclama; barti construye, mide y cuenta lo que salió mal.'],
    ideas: ['#ideas', 'lo que viene, lo que no sabemos y lo que está esperando su turno.'],
    pedalera: ['#pedalera', 'una pedalera que había en la pieza, y la decisión de entenderla por dentro sin romperla.'],
  };
  let n = 0;
  const cara = (expr, gato) => { n++; return caraSVG(expr || 'feliz', false, gato).replace(/id="(\w+)"/g, 'id="$1_' + n + '"').replace(/url\(#(\w+)\)/g, 'url(#$1_' + n + ')'); };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const formato = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
  const fechaTxt = f => { const d = new Date(f + 'T12:00:00'); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
  const minutos = e => { const [h, m] = e.hora.split(':').map(Number); return h * 60 + m; };
  const ESTADO = { descartado: ['descartado', 'descartado'], idea: ['idea', 'idea'], 'en obra': ['obra', 'en obra'] };

  $('yoCara').innerHTML = cara('feliz', 'neli');
  // la lista de la izquierda
  const lista = $('lista');
  let secActual = '';
  for (const c of CANALES) {
    const sec = c.tipo === 'dm' ? 'mensajes directos' : 'el taller';
    if (sec !== secActual) { secActual = sec; const s = document.createElement('div'); s.className = 'sec'; s.textContent = sec; lista.append(s); }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'can'; b.dataset.id = c.id;
    const cuantos = BITACORA.filter(e => e.canal === c.id && e.de !== 'sistema').length;
    b.innerHTML = (c.tipo === 'dm' ? '<span class="cara">' + cara('feliz', 'barti') + '</span>' : '<span class="gato">#</span>') + '<span>' + esc(c.nombre) + '</span><span class="n">' + cuantos + '</span>';
    b.addEventListener('click', () => abrir(c.id, true));
    lista.append(b);
  }

  function abrir(id, alPrincipio) {
    const c = CANALES.find(x => x.id === id) || CANALES[0];
    document.querySelectorAll('.can').forEach(b => b.setAttribute('aria-current', b.dataset.id === c.id ? 'true' : 'false'));
    $('cab').innerHTML = (c.tipo === 'dm' ? '<span class="cara">' + cara('feliz', 'barti') + '</span>' : '<span class="icono">#</span>') + '<b>' + esc(c.nombre) + '</b><span class="tema">' + esc(c.tema) + '</span>';
    const conv = $('conv'); conv.innerHTML = '';
    const intro = INTRO[c.id];
    if (intro) { const d = document.createElement('div'); d.className = 'inicio'; d.innerHTML = '<b>' + esc(intro[0]) + '</b><p>' + esc(intro[1]) + '</p>'; conv.append(d); }
    let dia = '', grupo = null, ultimo = null;
    for (const e of BITACORA.filter(x => x.canal === c.id)) {
      if (e.fecha !== dia) { dia = e.fecha; grupo = null; const d = document.createElement('div'); d.className = 'dia'; d.textContent = fechaTxt(e.fecha); conv.append(d); }
      if (e.de === 'sistema') { grupo = null; const s = document.createElement('div'); s.className = 'sistema'; s.textContent = e.texto + ' · ' + e.hora; conv.append(s); continue; }
      // mismo gato, a menos de 8 minutos: sigue el mismo bloque (como en los chats de verdad)
      if (!grupo || ultimo.de !== e.de || minutos(e) - minutos(ultimo) > 8) {
        grupo = document.createElement('div'); grupo.className = 'grupo';
        grupo.innerHTML = '<div class="cara">' + cara(e.cara, e.de) + '</div><div class="quien ' + e.de + '">' + NOMBRE[e.de] + '<span class="hora">' + e.hora + '</span></div>';
        conv.append(grupo);
      }
      ultimo = e;
      let el;
      if (e.tipo === 'zumbido') { el = document.createElement('div'); el.className = 'zumbido'; el.textContent = NOMBRE[e.de] + ' mandó un zumbido.'; }
      else if (e.tipo === 'app') {
        el = document.createElement('div'); el.className = 'archivo';
        el.innerHTML = '<img alt="" src="data:image/svg+xml;utf8,' + encodeURIComponent(ICONO_MEOW) + '"><div><b>Meowdacity</b><small>barti te mandó una app</small></div><button type="button">abrir</button>';
        el.querySelector('button').addEventListener('click', () => { try { window.parent.postMessage({ nelios: 'abrir', id: e.app }, '*'); } catch (er) {} });
      } else if (e.tipo === 'medida') {
        el = document.createElement('div'); el.className = 'medida' + (/[{};]/.test(e.texto) ? ' codigo' : ''); el.textContent = e.texto;
      } else {
        el = document.createElement('div'); el.className = 'linea';
        el.innerHTML = (e.version ? '<span class="chip ver">' + esc(e.version) + '</span>' : '') + formato(e.texto);
      }
      if (e.estado && ESTADO[e.estado]) el.insertAdjacentHTML('beforeend', '<span class="estado ' + ESTADO[e.estado][0] + '">' + ESTADO[e.estado][1] + '</span>');
      if (e.tipo === 'medida' && e.version) el.insertAdjacentHTML('afterbegin', '');
      grupo.append(el);
    }
    conv.scrollTop = alPrincipio ? 0 : conv.scrollHeight;
    try { localStorage.setItem('meowsenger.canal', c.id); } catch (er) {}
  }
  $('arriba').addEventListener('click', () => { $('conv').scrollTop = 0; });
  $('abajo').addEventListener('click', () => { $('conv').scrollTop = $('conv').scrollHeight; });
  let primero = 'barti'; try { primero = localStorage.getItem('meowsenger.canal') || 'barti'; } catch (er) {}
  abrir(primero, true);
  // la patita de NeliOS, también aquí adentro
  window.addEventListener('message', e => {
    const d = e.data; if (e.source !== window.parent || !d || d.nelios !== 'cursor') return;
    if (typeof d.patita === 'string' && d.patita.startsWith('data:image/')) { document.documentElement.style.setProperty('--patita', 'url(' + d.patita + ') 4 2'); document.body.classList.add('patita'); }
    else document.body.classList.remove('patita');
  });
  window.__msn = { abrir, total: BITACORA.length };
})();
</script>
</body>
</html>
