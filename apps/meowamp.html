<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preload" href="/fuentes/ibm-plex-mono-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fuentes/silkscreen-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

<title>Meowamp</title>
<style>@font-face { font-family: 'Silkscreen'; src: url(/fuentes/silkscreen-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; src: url(/fuentes/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; }
</style>
<style>
:root, body[data-skin="neli"] {
  --fondo: #EDE7FB; --marco: #DCCEF8; --borde: #2A2D52; --sombra: #A8B8E4; --texto: #2A2D52; --tenue: #6A6E9C;
  --boton: #FFFFFF; --boton-txt: #2A2D52; --boton-on: #F17D9E; --boton-on-txt: #FFFFFF;
  --riel: #CFC5EE; --lleno: #F17D9E; --perilla: #FFFFFF;
  --lista: #FBFAFF; --lista-txt: #2A2D52; --lista-sel: #F7E3EC; --lista-act: #D85C82; --lista-borde: #D9DEF3;
  --lcd: #17182E; --lcd-apagado: #24264A; --lcd-on: #FFB7CF; --lcd-acento: #B9A4FF; --lcd-bajo: #8C7BE8; --lcd-alto: #FF7FA8;
  --radio: 14px; --fuente: "MS Sans Serif", "Microsoft Sans Serif", Verdana, sans-serif;
}
body[data-skin="terminal"] {
  --fondo: #000; --marco: #050B07; --borde: #1F6B45; --sombra: #0B2A1A; --texto: #A8F0C8; --tenue: #2F9E63;
  --boton: #000; --boton-txt: #6CFFA8; --boton-on: #6CFFA8; --boton-on-txt: #000;
  --riel: #0E2A1C; --lleno: #6CFFA8; --perilla: #A8F0C8;
  --lista: #000; --lista-txt: #6CFFA8; --lista-sel: #0E2A1C; --lista-act: #F2FFF7; --lista-borde: #0E2A1C;
  --lcd: #000; --lcd-apagado: #07170E; --lcd-on: #6CFFA8; --lcd-acento: #4CC9FF; --lcd-bajo: #2F9E63; --lcd-alto: #B6FF6C;
  --radio: 0px; --fuente: 'IBM Plex Mono', ui-monospace, monospace;
}
body[data-skin="metal"] {
  --fondo: #9EA3AE; --marco: #C9CDD6; --borde: #2B2D35; --sombra: #6E737E; --texto: #1C1E24; --tenue: #4B4F59;
  --boton: #DADDE4; --boton-txt: #1C1E24; --boton-on: #3E4250; --boton-on-txt: #E9F27A;
  --riel: #7C818D; --lleno: #E9F27A; --perilla: #EEF0F4;
  --lista: #101216; --lista-txt: #D6E35A; --lista-sel: #2A2E38; --lista-act: #FFFFFF; --lista-borde: #2A2E38;
  --lcd: #0C0E10; --lcd-apagado: #1A1F14; --lcd-on: #D6E35A; --lcd-acento: #FF9F43; --lcd-bajo: #4FB34F; --lcd-alto: #FFD24A;
  --radio: 3px; --fuente: Verdana, "MS Sans Serif", sans-serif;
}
/* contraste AA (4,5:1) en la skin de Neli: texto tenue más oscuro, botón encendido con letra navy, rosado activo más hondo */
:root, body[data-skin="neli"] { --tenue: #4F5385; --boton-on-txt: #2A2D52; --lista-act: #A8345A; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--fuente); font-size: 12px; color: var(--texto); background: var(--fondo); display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow-x: hidden; overflow-y: auto; }
body.patita, body.patita button, body.patita input, body.patita select { cursor: var(--patita), auto; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lcd-alto); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* cada parte del reproductor es un módulo: se muestra, se esconde o se suelta como ventana propia */
.mod { flex: none; overflow: hidden; background: var(--marco); border: 2px solid var(--borde); border-radius: var(--radio); box-shadow: 4px 4px 0 var(--sombra); display: flex; flex-direction: column; min-height: 0; }
body[data-skin="metal"] .mod { background: linear-gradient(180deg, #E4E7EC, #B9BDC7 60%, #A9AEB9); box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #6E737E, 3px 3px 0 #6E737E; }
.mod > .cuerpo { padding: 10px; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
.cabeza { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-bottom: 2px solid var(--borde); min-height: 30px; }
.cabeza h2 { margin: 0; flex: 1; font: 400 10px 'Silkscreen', var(--fuente); letter-spacing: 1.5px; text-transform: uppercase; color: var(--tenue); }
.mini { width: 26px; height: 22px; padding: 0; border: 2px solid var(--borde); border-radius: calc(var(--radio) * .5); background: var(--boton); color: var(--boton-txt); display: grid; place-items: center; }
.mini svg { width: 12px; height: 12px; }
body.suelto { gap: 0; padding: 0; }
body.suelto .mod { flex: 1; border: 0; border-radius: 0; box-shadow: none; }
body.suelto .soltar { display: none; } body:not(.suelto) .pegar { display: none; }
body.cel .soltar { display: none !important; }   /* en celular cada ventana es la pantalla entera: soltar no tiene sentido */

/* el reproductor */
#pantalla { background: var(--lcd); border: 2px solid var(--borde); border-radius: calc(var(--radio) * .6); padding: 6px; display: grid; place-items: center; cursor: pointer; }
body[data-skin="metal"] #pantalla { box-shadow: inset 2px 2px 0 #000; }
#lcd { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.riel { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
.riel::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; border: 2px solid var(--borde); background: linear-gradient(90deg, var(--lleno) var(--p, 0%), var(--riel) var(--p, 0%)); }
.riel::-moz-range-track { height: 8px; border-radius: 99px; border: 2px solid var(--borde); background: linear-gradient(90deg, var(--lleno) var(--p, 0%), var(--riel) var(--p, 0%)); }
.riel::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--perilla); border: 2px solid var(--borde); }
.riel::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--perilla); border: 2px solid var(--borde); }
body[data-skin="terminal"] .riel::-webkit-slider-runnable-track, body[data-skin="metal"] .riel::-webkit-slider-runnable-track { border-radius: 0; }
body[data-skin="terminal"] .riel::-webkit-slider-thumb { border-radius: 0; }
.b { display: inline-flex; align-items: center; justify-content: center; height: 36px; min-width: 38px; padding: 0 9px; border: 2px solid var(--borde); border-radius: calc(var(--radio) * .7); background: var(--boton); color: var(--boton-txt); box-shadow: 0 3px 0 var(--borde); font-weight: 700; }
.b svg { width: 16px; height: 16px; }
.b:active, .mini:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--borde); }
.b[aria-pressed="true"] { background: var(--boton-on); color: var(--boton-on-txt); }
body[data-skin="metal"] .b { box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #7C818D, 0 2px 0 var(--borde); }
body[data-skin="terminal"] .b { box-shadow: none; }
.b.chico { font-size: 10px; font-family: 'Silkscreen', var(--fuente); letter-spacing: .5px; padding: 0 8px; }
.fila { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.fila .der { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.fila.modulos .b { height: 30px; }

/* el video: del ancho de todo */
#mVideo .caja { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
#mVideo .caja > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#mVideo .cuerpo { padding: 0; }
body.suelto #mVideo .caja { aspect-ratio: auto; flex: 1; }
body.suelto #mVideo .cuerpo { flex: 1; }
#vacioVideo { position: absolute; inset: 0; display: grid; place-items: center; color: #8C90B8; font: 400 10px 'Silkscreen', var(--fuente); letter-spacing: 1px; text-align: center; padding: 10px; }

/* el mixer: ecualizador de 10 bandas, preamp y volumen, como los de antes */
#mMixer .cuerpo { gap: 8px; }
.eq-arriba { display: flex; align-items: center; gap: 6px; }
.eq-arriba .b { height: 28px; }
#curva { image-rendering: pixelated; flex: 1; min-width: 0; height: 44px; background: var(--lcd); border: 2px solid var(--borde); image-rendering: pixelated; display: block; }
.eq { display: grid; grid-template-columns: 30px 34px 10px repeat(10, minmax(0, 1fr)) 10px 34px 18px; align-items: end; gap: 0 2px; background: var(--lcd); border: 2px solid var(--borde); border-radius: calc(var(--radio) * .5); padding: 6px 6px 4px; }
.eq .escala { height: 118px; display: flex; flex-direction: column; justify-content: space-between; font: 400 8px 'Silkscreen', var(--fuente); color: var(--lcd-bajo); text-align: right; padding: 4px 2px 18px 0; }
.eq .sep { height: 118px; border-left: 1px dashed var(--lcd-apagado); margin-bottom: 18px; justify-self: center; }
.banda { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.banda .et { font: 400 8px 'Silkscreen', var(--fuente); color: var(--lcd-on); letter-spacing: .3px; white-space: nowrap; height: 10px; }
.fader { position: relative; width: 100%; height: 108px; }
.fader::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--lcd-apagado); }
.fader input { position: absolute; left: 50%; top: 50%; width: 104px; height: 24px; transform: translate(-50%, -50%) rotate(-90deg); -webkit-appearance: none; appearance: none; background: transparent; margin: 0; }
.fader input::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, transparent var(--a, 50%), var(--color, var(--lcd-on)) var(--a, 50%) var(--b, 50%), transparent var(--b, 50%)), var(--lcd-apagado); }
.fader input::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, transparent var(--a, 50%), var(--color, var(--lcd-on)) var(--a, 50%) var(--b, 50%), transparent var(--b, 50%)), var(--lcd-apagado); }
.fader input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; margin-top: -6px; border-radius: 3px; background: var(--lcd-on); border: 2px solid var(--borde); }
.fader input::-moz-range-thumb { width: 10px; height: 16px; border-radius: 3px; background: var(--lcd-on); border: 2px solid var(--borde); }
.banda.pre .fader input::-webkit-slider-thumb, .banda.vol .fader input::-webkit-slider-thumb { background: var(--lcd-acento); }
.eq.apagado .banda:not(.vol) { opacity: .4; }
.medidor { width: 12px; height: 108px; border: 1px solid var(--lcd-apagado); display: flex; flex-direction: column-reverse; padding: 1px; gap: 1px; margin-bottom: 14px; }
.medidor i { flex: 1; background: var(--lcd-apagado); }
.medidor i.on { background: var(--lcd-bajo); } .medidor i.on.medio { background: var(--lcd-on); } .medidor i.on.alto { background: var(--lcd-alto); }
.eq-abajo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.eq-abajo .lectura { font: 600 12px 'IBM Plex Mono', ui-monospace, monospace; color: var(--texto); margin-right: auto; }
.eq-abajo .b { height: 28px; }
/* en el celular no caben 13 columnas con escala: se va la escala y se aprietan las etiquetas */
body.cel .eq { grid-template-columns: 26px 4px repeat(10, minmax(0, 1fr)) 4px 26px 12px; gap: 0; padding: 6px 4px 4px; }
body.cel .eq .escala { display: none; }
body.cel .banda .et { font-size: 7px; letter-spacing: 0; }
#presets { height: 28px; border: 2px solid var(--borde); border-radius: calc(var(--radio) * .6); background: var(--boton); color: var(--boton-txt); font: 400 10px 'Silkscreen', var(--fuente); padding: 0 6px; }

/* la lista */
#mLista { flex: 1 1 auto; min-height: 220px; background: var(--lista); color: var(--lista-txt); }
#mLista .cabeza { background: var(--marco); }
#mLista .cuerpo { padding: 0; flex: 1; gap: 0; }
.listas { display: flex; gap: 6px; padding: 8px; border-bottom: 2px solid var(--lista-borde); align-items: center; flex-wrap: wrap; }
.listas select { flex: 1; min-width: 120px; height: 30px; border: 2px solid var(--borde); border-radius: calc(var(--radio) * .6); background: var(--lista); color: var(--lista-txt); padding: 0 6px; font: 12px 'IBM Plex Mono', ui-monospace, monospace; }
.listas .b, .pie .b, form.linea .b { height: 30px; }
#pistas { flex: 1; min-height: 60px; overflow-y: auto; margin: 0; padding: 4px 0; list-style: none; font: 12px 'IBM Plex Mono', ui-monospace, monospace; }
/* la barra de desplazamiento de la lista, según la skin: lavanda redonda en Neli, bloque verde en Terminal, metal con relieve en Metal */
* { scrollbar-width: thin; scrollbar-color: var(--sb, var(--riel)) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--sb, var(--riel)) padding-box; border: 2px solid transparent; border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--sb-borde, var(--borde)); }
::-webkit-scrollbar-thumb:hover { background-color: var(--sb-encima, var(--lleno)); }
::-webkit-scrollbar-corner { background: transparent; }
body[data-skin="neli"], :root { --sb: #DCCEF8; --sb-borde: #A8B8E4; --sb-encima: #F7B8CB; }
body[data-skin="terminal"] { --sb: #0E2A1C; --sb-borde: #2F9E63; --sb-encima: #1F6B45; }
body[data-skin="terminal"] ::-webkit-scrollbar-thumb { border-radius: 0; border-width: 2px 2px; }
body[data-skin="terminal"] ::-webkit-scrollbar-track { background: repeating-linear-gradient(180deg, #07170E 0 2px, transparent 2px 4px) center / 2px 100% no-repeat; }
body[data-skin="metal"] { --sb: #C9CDD6; --sb-borde: #2B2D35; --sb-encima: #E9F27A; }
body[data-skin="metal"] ::-webkit-scrollbar-thumb { border-radius: 2px; background-image: linear-gradient(90deg, #EEF0F4, #B9BDC7 60%, #9EA3AE); box-shadow: inset 0 0 0 1px #2B2D35, inset 1px 1px 0 2px rgba(255,255,255,.7); }
body[data-skin="metal"] ::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(90deg, #F6F8B0, #E9F27A); }
body[data-skin="metal"] ::-webkit-scrollbar-track { background: #1A1D22; }
@supports selector(::-webkit-scrollbar) { * { scrollbar-width: auto; scrollbar-color: auto; } }
#pistas li { display: flex; align-items: stretch; }
#pistas li > .toca { flex: 1; min-width: 0; display: flex; gap: 8px; padding: 7px 12px; border: 0; background: none; text-align: left; color: var(--lista-txt); min-height: 34px; align-items: center; font-family: inherit; }
#pistas .toca:hover { background: var(--lista-sel); }
#pistas .n { width: 22px; flex: none; color: var(--tenue); }
#pistas .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pistas .dur { color: var(--tenue); }
#pistas li.act .n, #pistas li.act .dur { color: var(--lista-act); }
#pistas .yt { flex: none; font: 400 9px 'Silkscreen', var(--fuente); padding: 1px 5px; border-radius: 4px; background: #FF3D57; color: #fff; letter-spacing: .5px; }
#pistas li.act .toca { color: var(--lista-act); font-weight: 600; background: var(--lista-sel); }
#pistas .quitar { flex: none; width: 34px; border: 0; background: none; color: var(--lista-txt); opacity: .55; font-size: 15px; }
#pistas .quitar:hover { opacity: 1; background: var(--lista-sel); }
#pistas .vacia { padding: 18px 12px; opacity: .7; font-family: var(--fuente); line-height: 1.5; }
form.linea { display: flex; gap: 6px; padding: 8px; border-top: 2px solid var(--lista-borde); }
form.linea input { flex: 1; min-width: 0; height: 30px; border: 2px solid var(--borde); border-radius: calc(var(--radio) * .6); padding: 0 9px; font: 12px 'IBM Plex Mono', ui-monospace, monospace; background: var(--lista); color: var(--lista-txt); }
#elegirArchivo { border-top: 2px solid var(--lista-borde); padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
#elegirArchivo button { border: 2px solid var(--lista-borde); background: var(--lista); color: var(--lista-txt); border-radius: calc(var(--radio) * .6); padding: 5px 8px; font: 11px 'IBM Plex Mono', ui-monospace, monospace; }
.pie { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-top: 2px solid var(--lista-borde); font-size: 11px; flex-wrap: wrap; }
.pie .tot { opacity: .75; font-family: 'IBM Plex Mono', ui-monospace, monospace; margin-right: auto; }
@media (prefers-reduced-motion: reduce) { .b:active, .mini:active { transform: none; } }
</style>
</head>
<body data-skin="neli"><script>if(/[?&]ventana(&|$)/.test(location.search))document.body.classList.add("en-ventana");</script>
<!-- EL REPRODUCTOR -->
<section class="mod" id="mPrincipal" role="main" aria-label="Reproductor"><h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Meowamp</h1>
  <div class="cuerpo">
    <div id="pantalla" title="toca la pantalla: cambia entre las barras y la onda"><canvas id="lcd" width="184" height="48" role="img" aria-label="Pantalla del reproductor"></canvas></div>
    <input class="riel" id="pos" type="range" min="0" max="1000" value="0" aria-label="Posición en la pista">
    <div class="fila">
      <button class="b" id="bAnt" aria-label="Pista anterior (z)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 V13 M13 3 L5 8 L13 13 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button class="b" id="bPlay" aria-label="Reproducir (x)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5 L13.5 8 L4 13.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
      <button class="b" id="bPausa" aria-label="Pausa (c)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3 H6.5 V13 H4 Z M9.5 3 H12 V13 H9.5 Z" fill="currentColor"/></svg></button>
      <button class="b" id="bStop" aria-label="Detener (v)"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" fill="currentColor"/></svg></button>
      <button class="b" id="bSig" aria-label="Pista siguiente (b)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3 V13 M3 3 L11 8 L3 13 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <span class="der">
        <button class="b chico" id="bAzar" aria-pressed="false" aria-label="Orden al azar">azar</button>
        <button class="b chico" id="bRep" aria-pressed="false" aria-label="Repetir la lista">rep</button>
        <button class="b chico" id="bSkin" aria-label="Cambiar skin">skin</button>
      </span>
    </div>
    <div class="fila modulos" role="group" aria-label="Partes del reproductor">
      <button class="b chico" data-mod="mixer" aria-pressed="false">mixer</button>
      <button class="b chico" data-mod="video" aria-pressed="false">video</button>
      <button class="b chico" data-mod="lista" aria-pressed="true">lista</button>
    </div>
  </div>
</section>

<!-- EL MIXER -->
<section class="mod" id="mMixer" data-mod="mixer" aria-label="Mixer" hidden>
  <div class="cabeza"><h2>mixer</h2>
    <button class="mini soltar" aria-label="Soltar el mixer como ventana"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 2 H10 V7 M10 2 L4 8 M2 5 V10 H7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="mini pegar" aria-label="Volver a pegar el mixer al reproductor"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M10 2 L4 8 M4 3 V8 H9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="mini esconder" aria-label="Esconder el mixer"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6 H10" stroke="currentColor" stroke-width="2"/></svg></button>
  </div>
  <div class="cuerpo">
    <div class="eq-arriba">
      <button class="b chico" id="bEq" aria-pressed="true">on</button>
      <canvas id="curva" width="160" height="20" role="img" aria-label="La curva del ecualizador: cuánto sube o baja cada altura"></canvas>
      <select id="presets" aria-label="Ajustes guardados del ecualizador"></select>
    </div>
    <div class="eq" id="eq">
      <div class="escala" aria-hidden="true"><span>+12</span><span>0</span><span>-12</span></div>
      <div class="banda pre"><div class="fader"><input id="pre" type="range" min="-12" max="12" step="0.5" value="0" aria-label="Preamp"></div><span class="et">pre</span></div>
      <div class="sep" aria-hidden="true"></div>
      <div class="banda"><div class="fader"><input class="banda-in" data-i="0" type="range" min="-12" max="12" step="0.5" value="0" aria-label="60 hercios"></div><span class="et">60</span></div>
      <div class="banda"><div class="fader"><input class="banda-in" data-i="1" type="range" min="-12" max="12" step="0.5" value="0" aria-label="170 hercios"></div><span class="et">170</span></div>

<script>
(() => {
  'use strict';

  const MODULO = window.MODULO || new URLSearchParams(location.search).get('modulo') || 'principal';
  const PRINCIPAL = MODULO === 'principal';
  const BASE = window.ARCHIVOS_BASE || '../archivos/';

  async function bytesDe(url) {   // en el artefacto los archivos vienen como data: y ahí fetch está prohibido

  const leer = (k, d) => { try { const v = localStorage.getItem('nelios.meowamp.' + k); return v === null ? d : v; } catch (e) { return d; } };

  const mmss = s => { s = Math.max(0, Math.round(s || 0)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

    '6':'..##..#...#....####.#...##...#.###.', '7':'#####....#...#...#...#....#....#...', '8':'.###.#...##...#.###.#...##...#.###.',

    'L':'#....#....#....#....#....#....#####', 'M':'#...###.###.#.##.#.##...##...##...#', 'N':'#...##...###..##.#.##..###...##...#',
    'O':'.###.#...##...##...##...##...#.###.', 'P':'####.#...##...#####.#....#....#....', 'Q':'.###.#...##...##...##.#.##..#..##.#',
    'R':'####.#...##...#####.#.#..#..#.#...#', 'S':'.#####....#.....###.....#....#####.', 'T':'#####..#....#....#....#....#....#..',
    'U':'#...##...##...##...##...##...#.###.', 'V':'#...##...##...##...##...#.#.#...#..', 'W':'#...##...##...##.#.##.#.##.#.#.#.#.',
    'X':'#...##...#.#.#...#...#.#.#...##...#', 'Y':'#...##...#.#.#...#....#....#....#..', 'Z':'#####....#...#...#...#...#....#####',
    'Ñ':'.##.##.##.#...###..##.#.##..###...#', ' ':'...................................', ':':'.......#....#.........#....#.......',
    '.':'.........................##...##...', '-':'...............###.................', '/':'....#....#...#...#...#...#....#....',
    '(':'...#...#...#....#....#.....#.....#.', ')':'.#.....#.....#....#....#...#...#...', '!':'..#....#....#....#....#.........#..',
    '?':'.###.#...#....#...#...#.........#..', '+':'.......#....#..#####..#....#.......', ',':'....................##....#...#....',
    '%':'##...##..#...#...#...#...#..##...##', '#':'.#.#..#.#.#####.#.#.#####.#.#..#.#.', '·':'.................#.................',
    '¿':'..#.........#...#...#....#...#.###.', '¡':'..#.........#....#....#....#....#..', "'":'..#....#...#.......................',
    '>':'#.....#.....#.....#...#...#...#....', '<':'....#...#...#...#.....#.....#.....#', '_':'..............................#####'
  };
  G['*'] = '.......#..#.#.#.###.#.#.#..#.......';   // el separador del nombre que corre (antes salía como ?)
  const CH = 6;
  const norm = t => String(t).toUpperCase().replace(/Ñ/g, '\u0001').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\u0001/g, 'Ñ');
  const cv = $('lcd'), g = cv.getContext('2d');
  // dos acomodos de la pantalla: ancho (computador) y compacto (celular). Siempre con escala entera ×2 o más.
  const ANCHA = { W: 184, H: 48, ancho: 17, tit: [76, 3], l2: [76, 13], khz: 54, l3: [76, 22], l4: [76, 32], l5: [76, 41], vis: [3, 21, 66, 25], aviso: [74, 1, 110, 20] };
  const COMPACTA = { W: 140, H: 56, ancho: 22, tit: [3, 20], l2: [3, 29], khz: 54, l3: [99, 29], l4: [3, 38], l5: [3, 47], vis: [76, 2, 61, 15], aviso: [1, 18, 138, 19] };

  const CARPETA = { id: 'neli', nombre: 'la carpeta de neli', fija: true, items: [] };

  function guardarListas() { guardar('listas', JSON.stringify(listas.map(l => ({ id: l.id, nombre: l.nombre, items: l.items })))); guardar('activa', activa); }

    }

  }

  // ---------- el estado de lo que suena ----------
  let sonando = null;                                      // el item que suena (o el elegido)
  let estado = 'stop', inicio = 0, offset = 0, ficha = 0, mostrarResta = false, modoVisor = leer('visor', 'frec');
  let aviso = '', avisoHasta = 0, marquee = 0, vol = +leer('vol', 80), mudo = false;
  let eq = { pre: 0, g: FRECS.map(() => 0) }, eqOn = leer('eqOn', '1') === '1', eqPreset = leer('eqPreset', 'plano');
  try { const e = JSON.parse(leer('eq', 'null')); if (e && Array.isArray(e.g) && e.g.length === FRECS.length) eq = { pre: +e.pre || 0, g: e.g.map(x => Math.max(-12, Math.min(12, +x || 0))) }; } catch (e) {}
  function aplicarEq() {   // con rampa: ningún filtro salta de golpe
    if (!ctx) return; const t = ctx.currentTime;
    const ir = (prm, v) => { prm.cancelScheduledValues(t); prm.setValueAtTime(prm.value, t); prm.linearRampToValueAtTime(v, t + RAMPA); };

  }
  function guardarEq() { guardar('eq', JSON.stringify(eq)); guardar('eqOn', eqOn ? '1' : '0'); guardar('eqPreset', eqPreset); }
  const igual = (a, b) => !!a && !!b && (a.yt ? a.yt === b.yt : a.ruta === b.ruta);

  // ---------- el audio de los archivos: una sola cadena, con rampas (ningún parámetro salta de golpe) ----------
  let ctx = null, analiza = null, volNodo = null, voz = null, fuente = null, preNodo = null, bandasNodo = [];

  // ===================== PARTES QUE SIRVEN A LAS DOS (principal y sueltas) =====================
  function orden(m) { if (PRINCIPAL) window.__orden(m); else enviar(Object.assign({ tipo: 'cmd' }, m)); }
  function patita(d) {

    $('bArchivo').addEventListener('click', () => { const f = $('elegirArchivo'); f.hidden = !f.hidden; $('fYt').hidden = true; $('bArchivo').setAttribute('aria-expanded', String(!f.hidden)); });
    for (const id of ['ytLink', 'nomLista']) $(id).addEventListener('keydown', e => e.stopPropagation());
  }
  function montarMixer() {
    $('vol').addEventListener('input', e => { $('volTxt').textContent = e.target.value + '% · ' + dbTxt(+e.target.value); orden({ accion: 'vol', v: +e.target.value }); });
    document.querySelectorAll('#eq .fader input').forEach(el => el.addEventListener('input', () => pintarBanda(el)));
    $('pre').addEventListener('input', e => orden({ accion: 'eqBanda', i: 'pre', v: +e.target.value }));
    document.querySelectorAll('.banda-in').forEach(el => el.addEventListener('input', e => orden({ accion: 'eqBanda', i: +e.target.dataset.i, v: +e.target.value })));
    // doble clic en una banda: vuelve a 0
    document.querySelectorAll('#eq .fader input').forEach(el => el.addEventListener('dblclick', () => { if (el.id === 'vol') return; el.value = 0; el.dispatchEvent(new Event('input')); }));
    $('bEq').addEventListener('click', () => orden({ accion: 'eqOn' }));
    $('bPlano').addEventListener('click', () => orden({ accion: 'eqPreset', nombre: 'plano' }));
    $('presets').addEventListener('change', e => { if (e.target.value) orden({ accion: 'eqPreset', nombre: e.target.value }); });
    $('bMudo').addEventListener('click', () => orden({ accion: 'mudo' }));
    const md = $('medidor'); for (let i = 0; i < 14; i++) { const s = document.createElement('i'); if (i >= 9) s.className = 'medio'; if (i >= 12) s.className = 'alto'; md.append(s); }
    if (window.ResizeObserver) new ResizeObserver(() => dibujarCurva()).observe(document.querySelector('.eq-arriba'));
    const ps = $('presets'); ps.innerHTML = '<option value="">presets</option>' + Object.keys(PRESETS).map(n => '<option value="' + n + '">' + n + '</option>').join('');
  }
  // la barra va del 0 a la perilla (el volumen, desde abajo); sube hacia el coral, baja hacia el lila
  function pintarBanda(el) {
    const a = +el.min, b = +el.max, p = (+el.value - a) / (b - a) * 100, cero = el.id === 'vol' ? 0 : 50;
    el.style.setProperty('--a', Math.min(p, cero) + '%'); el.style.setProperty('--b', Math.max(p, cero) + '%');
    el.style.setProperty('--color', el.id === 'vol' ? 'var(--lcd-acento)' : +el.value >= 0 ? 'var(--lcd-alto)' : 'var(--lcd-bajo)');
  }
  // la curva: la respuesta de verdad de los 10 filtros, calculada con los mismos filtros (en un contexto que no suena)
  var curvaCtx = null, curvaFiltros = null;
  var curvaUlt = null;
  function dibujarCurva(s) {
    s = s || curvaUlt; if (!s) return; curvaUlt = s;
    const cv = $('curva'), g2 = cv.getContext('2d');
    const anchoCss = cv.parentElement.clientWidth - $('bEq').offsetWidth - $('presets').offsetWidth - 12 - 4;
    const wq = Math.max(40, Math.floor(anchoCss / 2)); if (cv.width !== wq) { cv.width = wq; cv.height = 20; cv.style.width = (wq * 2) + 'px'; cv.style.flex = 'none'; }
    const W2 = cv.width, H2 = cv.height;

  function pintarMedidor(v) {

    const ea = $('elegirArchivo'); ea.innerHTML = '';

    document.querySelectorAll('#eq .fader input').forEach(pintarBanda);
    $('bEq').setAttribute('aria-pressed', String(!!s.eqOn)); $('eq').classList.toggle('apagado', !s.eqOn || !!s.yt);

  // en la ventana suelta del video: el reproductor de youtube vive aquí y le cuenta todo a la principal
  function montarVideoRemoto() {

      if (window.YT && window.YT.Player) return res();

                      onError: () => contar({ error: true }) } });

        else { jugador.seekTo(m.desde || 0, true); jugador.playVideo(); }
      }
      if (!jugador) return;
      if (m.op === 'pausa') jugador.pauseVideo();
      if (m.op === 'seguir') jugador.playVideo();
      if (m.op === 'stop') jugador.stopVideo();
      if (m.op === 'vol') jugador.setVolume(m.v);
      if (m.op === 'destruir') { clearInterval(tic); try { jugador.destroy(); } catch (er) {} jugador = null; idAct = null; const c = document.createElement('div'); c.id = 'ytCaja'; $('mVideo').querySelector('.caja').append(c); $('vacioVideo').hidden = false; }
    });
  }
  window.addEventListener('message', e => { const d = e.data; if (e.source === window.parent && d && d.nelios === 'cursor' && !PRINCIPAL) patita(d); });
