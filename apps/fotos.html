<head>

<title>Fotos</title>
<style>@font-face { font-family: 'Silkscreen'; src: url(/fuentes/silkscreen-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; src: url(/fuentes/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; }
</style>
<style>
:root { --crema: #FAF4E9; --azul: #A8B8E4; --navy: #3B3F77; --tinta: #2A2D52; --coral: #F17D9E; --lavanda: #DCCEF8; --tenue: #6A6E9C; --linea: #D9DEF3; --sel: #E7E0FB; --ui: "MS Sans Serif", "Microsoft Sans Serif", Verdana, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--ui); font-size: 13px; color: var(--tinta); background: var(--crema); display: flex; flex-direction: column; overflow: hidden; }
body.patita, body.patita button { cursor: var(--patita), auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; min-width: 40px; padding: 0 14px; border: 2px solid var(--tinta); border-radius: 12px; background: #fff; color: var(--tinta); font-weight: 700; font-size: 13px; box-shadow: 0 3px 0 var(--tinta); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { background: #F6F3FF; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }
.btn.cuadro { padding: 0; width: 40px; font-size: 18px; }
.btn.prin { background: var(--coral); color: #fff; }
.btn.prin:hover { background: #E96A8E; }
.btn[aria-pressed="true"] { background: var(--lavanda); }
.btn:disabled { opacity: .45; pointer-events: none; }


#centro { flex: 1; min-height: 0; display: flex; }
#escena { flex: 1; min-width: 0; position: relative; display: grid; place-items: center; padding: 14px; background:
  repeating-conic-gradient(#F3EEE3 0 25%, #FAF4E9 0 50%) 0 0 / 22px 22px; }
#escena { overflow: hidden; }
#marco { position: relative; background: #fff center / cover no-repeat; touch-action: none; user-select: none; -webkit-user-select: none; }
/* lo que queda fuera del marco se ve desteñido (no sale en la imagen guardada); el sticker elegido se ve entero para poder tomar sus tiradores */
#marco::after { content: ''; position: absolute; inset: -3px; border: 3px solid var(--tinta); box-shadow: 5px 5px 0 var(--azul), 0 0 0 9999px rgba(250, 244, 233, .86); pointer-events: none; z-index: 2; }
#marco.sin { display: grid; place-items: center; color: var(--tenue); }

/* un sticker: se arrastra; seleccionado, tiene un tirador para agrandar y girar */
.st { position: absolute; transform-origin: 50% 50%; touch-action: none; cursor: grab; z-index: 1; }
.st.sel { z-index: 3; }
.st img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
.st.sel { outline: 2px dashed var(--navy); outline-offset: 4px; }
.st .tir, .st .bor { display: none; position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--tinta); place-items: center; font-weight: 700; padding: 0; line-height: 1; }
.st.sel .tir, .st.sel .bor { display: grid; }
.st .tir { right: -20px; bottom: -20px; background: var(--lavanda); cursor: nwse-resize; touch-action: none; }
.st .bor { right: -20px; top: -20px; background: var(--coral); color: #fff; }

/* la bandeja de stickers */
#bandeja[hidden] { display: none; }
#bandeja { width: 230px; flex: none; border-left: 2px solid var(--azul); background: #fff; overflow-y: auto; padding: 10px; }
#bandeja h2 { font-family: 'Silkscreen', var(--ui); font-weight: 400; font-size: 10px; letter-spacing: 1px; color: var(--tenue); margin: 4px 2px 8px; text-transform: uppercase; }
#stickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#stickers button { min-width: 0; overflow: hidden; background: var(--crema); border: 2px solid var(--linea); border-radius: 10px; padding: 6px; aspect-ratio: 1; display: grid; place-items: center; }
#stickers button:hover { border-color: var(--azul); background: #fff; }
#stickers img { width: 100%; height: 100%; max-width: 100%; object-fit: contain; pointer-events: none; }
#bandeja .nota { color: var(--tenue); font-size: 11px; line-height: 1.45; margin: 10px 2px 0; }

/* abajo, todo junto: anterior, las fotos, siguiente, cuál es y guardar */
#abajo { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #EFEAF9; border-top: 2px solid var(--azul); }
#tira { flex: 0 1 auto; min-width: 0; display: flex; gap: 8px; padding: 2px; overflow-x: auto; scrollbar-width: thin; }
#info { flex: none; margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 0; max-width: 160px; }
#nombre { font-weight: 700; color: var(--navy); font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cuenta { color: var(--tenue); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; }
#tira button { flex: none; width: 64px; height: 64px; padding: 0; border: 2px solid transparent; border-radius: 8px; background: #fff center / cover no-repeat; }
#tira button[aria-current="true"] { border-color: var(--navy); box-shadow: 2px 2px 0 var(--navy); }
#aviso { z-index: 5; position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
#aviso.ve { opacity: 1; }

@media (max-width: 639px) {
  #centro { flex-direction: column; }
  #bandeja { width: auto; border-left: 0; border-top: 2px solid var(--azul); max-height: 34%; padding: 8px; }
  #bandeja h2, #bandeja .nota { display: none; }
  #stickers { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); }
  #escena { padding: 10px; }
  #abajo { flex-wrap: wrap; gap: 8px; }
  #tira { flex: 1 1 100%; order: -1; }
  #info { flex: 1; align-items: center; max-width: none; }
  #stBtn { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } #aviso { transition: none; } }
</style>
</head>

    <h2>stickers</h2>

    <p class="nota">toca uno para ponerlo. arrástralo para moverlo; el círculo lila lo agranda y lo gira. también: flechas, + y −, y suprimir.</p>

</div>

    if (!ver && elegido >= 0) { elegido = -1; pintarStickers(); }
    try { localStorage.setItem('nelios.fotos.stickers', ver ? '1' : '0'); } catch (e) {}
    requestAnimationFrame(medir);
  }
  $('stBtn').addEventListener('click', () => bandeja($('bandeja').hidden));
  try { if (localStorage.getItem('nelios.fotos.stickers') === '0') bandeja(false); } catch (e) {}
  $('ant').addEventListener('click', () => mostrar(i - 1));
  $('sig').addEventListener('click', () => mostrar(i + 1));
  $('guardar').addEventListener('click', () => guardar().catch(() => avisar('no se pudo guardar.')));
  // deslizar con el dedo para cambiar de foto (cuando no se está moviendo un sticker)
  let x0 = null;
  $('escena').addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && !e.target.closest('.st')) x0 = e.clientX; });
  $('escena').addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 60) mostrar(i + (dx < 0 ? 1 : -1)); });
  if (window.ResizeObserver) new ResizeObserver(medir).observe($('escena')); else addEventListener('resize', medir);

  window.addEventListener('message', e => {
    const d = e.data; if (e.source !== window.parent || !d) return;
    if (d.nelios === 'archivo') { if (!fotos.length) { pendiente = d.ruta; return; } const k = fotos.findIndex(f => f.ruta === d.ruta); if (k >= 0) mostrar(k); }   // si llega antes de leer la carpeta, espera
    if (d.nelios === 'cursor') {
      if (typeof d.patita === 'string' && d.patita.startsWith('data:image/')) { document.documentElement.style.setProperty('--patita', 'url(' + d.patita + ') 4 2'); document.body.classList.add('patita'); }
      else document.body.classList.remove('patita');
    }
  });

  (async () => {
    let indice;
    try { indice = EMB ? EMB.indice : await (await fetch(BASE + 'indice.json', { cache: 'no-cache' })).json(); }
    catch (e) { $('marco').classList.add('sin'); $('marco').textContent = 'no se pudo leer la carpeta.'; return; }
    fotos = indice.archivos.filter(a => a.tipo === 'imagen');
    if (!fotos.length) { $('marco').classList.add('sin'); $('marco').textContent = 'no hay fotos todavía.'; return; }
    fotos.forEach((f, k) => {
      const b = document.createElement('button'); b.style.backgroundImage = 'url("' + urlDe(f.mini) + '")'; b.setAttribute('aria-label', f.nombre);
      b.addEventListener('click', () => mostrar(k)); $('tira').append(b);
    });
    await Promise.all(imgs.map(im => im.decode().catch(() => {})));
    mostrar(Math.max(0, fotos.findIndex(f => f.ruta === pendiente)));
  })();
})();
</script>
</body>
</html>
