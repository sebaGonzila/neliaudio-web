<title>Grabadora</title>
<style>
@font-face { font-family: 'Silkscreen'; src: url(/fuentes/silkscreen-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'VT323'; src: url(/fuentes/vt323-latin-400-normal.woff2) format('woff2'); font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; src: url(/fuentes/ibm-plex-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'IBM Plex Mono'; src: url(/fuentes/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url(/fuentes/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'IBM Plex Sans'; src: url(/fuentes/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); font-weight: 600; font-display: swap; }

/* El cuerpo sigue la piel de Meowdacity; la pantallita es negra por dentro, como todas las apps de audio. */
:root {
  --fondo: #000; --fondo-img: none; --panel: #04100A; --barra: #08180F; --linea: #0E3A24; --linea-suave: #0E3A24;
  --tenue: #2F9E63; --neon: #6CFFA8; --neon-borde: #6CFFA8; --neon-suave: rgba(108,255,168,.14); --texto: #A8F0C8; --tinta: #F2FFF7; --sobre-neon: #000;
  --lienzo: #010502; --rejilla: #041A0E; --cero: #0E3A24; --onda: #B794FF; --alto: #F2FFF7; --ve: #B794FF; --cabezal: #4CC9FF; --salto: #FFD23F;
  --umbral: #FF6B8B; --ambar: #FFD23F; --nota: #4CC9FF; --tecla: #071A10; --negra: #000; --brillo: rgba(108,255,168,.45);
  --radio: 0px; --radio-btn: 0px; --pista: #0E3A24; --boton: transparent;
  --sombra-panel: 6px 6px 0 #0E3A24; --sombra-btn: 3px 3px 0 #0E3A24;
  --f-marca: 'Silkscreen', 'Courier New', monospace;
  --f-etiqueta: 'Silkscreen', 'Courier New', monospace;
  --f-numero: 'VT323', 'Courier New', monospace;
  --f-texto: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --k-num: 1;                       /* VT323 es chica: la otra fuente de números se escala a 0,72 */
  --borde: 2px;
  color-scheme: dark;
}
body[data-piel="neli"] {
  --fondo: #E4E0F8; --fondo-img: radial-gradient(1200px 600px at 15% -10%, #F3EEFF 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #D6DDF8 0%, transparent 60%), linear-gradient(160deg, #E9E3FB, #DCDDF7);
  --panel: rgba(255,255,255,.74); --barra: linear-gradient(180deg, #F1F3FE, #E4E9FB); --linea: #B7C1EC; --linea-suave: #D4DAF4;
  --tenue: #575C93; --neon: #F27FA3; --neon-borde: #E8668F; --neon-suave: #FFE6EE; --texto: #3E4380; --tinta: #2B2F66; --sobre-neon: #2A2D52;
  --lienzo: #FBFAFF; --rejilla: #ECEAFB; --cero: #D9D3F6; --onda: #DCD4FA; --alto: #7A63E0; --ve: #7A63E0; --cabezal: #5BBFEF; --salto: #F27FA3;
  --umbral: #F27FA3; --ambar: #D9962A; --nota: #3D8FC6; --tecla: #FFFFFF; --negra: #3E4380; --brillo: rgba(242,127,163,.35);
  --radio: 14px; --radio-btn: 9px; --pista: #D6DBF4; --boton: #FFFFFF;
  --sombra-panel: 0 8px 24px rgba(72,76,150,.12), 0 1px 0 rgba(255,255,255,.9) inset; --sombra-btn: 0 1px 2px rgba(72,76,150,.12);
  --f-marca: 'Silkscreen', 'Courier New', monospace;
  --f-etiqueta: 'IBM Plex Sans', system-ui, sans-serif;
  --f-numero: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --f-texto: 'IBM Plex Sans', system-ui, sans-serif;
  --k-num: .72;
  --borde: 1.5px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo-img), var(--fondo); color: var(--texto); font-family: var(--f-texto); font-size: 12px; line-height: 1.35; overflow: hidden; }
body[data-piel="neli"] { --tenue: #575C93; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px dashed var(--tinta); outline-offset: 2px; }
.num { font-family: var(--f-numero); font-variant-numeric: tabular-nums; }
.etq { font-family: var(--f-etiqueta); font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); }

/* el aparato: un panel con la pantallita al centro, los enchufes a los lados y los botones abajo */
.aparato { height: 100%; display: grid; grid-template-columns: 58px minmax(0, 1fr) 58px; grid-template-rows: auto auto auto; align-content: start; gap: 6px 8px; padding: 8px 10px; }
.lado { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
/* un enchufe hembra dibujado en el panel (dentro de NeliOS, el cable se enchufa justo encima) */
.toma-hembra { display: grid; justify-items: center; gap: 3px; background: none; border: 0; padding: 0; }
.toma-hembra .hueco { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle, #111 0 30%, #9AA0C8 32% 52%, #2A2D52 54% 70%, #C9CDD6 72%); box-shadow: inset 0 1px 2px rgba(0,0,0,.4), 0 0 0 3px var(--boton); }
body[data-piel="terminal"] .toma-hembra .hueco { box-shadow: 0 0 0 2px var(--linea); }
.toma-hembra .led { width: 6px; height: 6px; border-radius: 50%; background: var(--rejilla); box-shadow: inset 0 0 0 1px var(--linea); }
.toma-hembra.on .led { background: #47E08A; box-shadow: 0 0 6px #47E08A; }
.toma-hembra.salida.on .led { background: #E5484D; box-shadow: 0 0 6px #E5484D; }
.mic { display: grid; justify-items: center; gap: 2px; width: 46px; padding: 5px 0 4px; background: var(--boton); border: var(--borde) solid var(--linea); border-radius: var(--radio-btn); color: var(--tenue); }
.mic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.mic.on { border-color: #47E08A; color: var(--tinta); box-shadow: 0 0 0 2px rgba(71,224,138,.25); }

/* la pantallita: dos carretes y la cinta entre ellos, con la onda de lo que entra o lo que suena */
.pantalla { position: relative; align-self: center; aspect-ratio: 3 / 1; width: 100%; max-height: 100%; background: #050807; border: 3px solid #1C2030; border-radius: 6px; box-shadow: inset 0 0 0 1px #000, inset 0 0 18px rgba(108,255,168,.08); overflow: hidden; }
body[data-piel="terminal"] .pantalla { border-radius: 0; border-color: var(--linea); }
#lienzo { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.lecturas { position: absolute; left: 0; right: 0; bottom: 2px; display: flex; justify-content: space-between; padding: 0 6px; font-family: 'VT323', var(--f-numero), monospace; font-size: 15px; line-height: 1; color: #6CFFA8; pointer-events: none; text-shadow: 0 0 6px rgba(108,255,168,.4); }
.lecturas b { font-weight: 400; color: #4CC9FF; }
.lecturas .rec { color: #FF6B8B; }

/* la barra para moverse por la toma */
.barra { grid-column: 1 / 4; height: 18px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.barra::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--linea); }
.barra::-moz-range-track { height: 4px; border-radius: 4px; background: var(--linea); }
.barra::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; margin-top: -7px; background: var(--boton); border: 2px solid var(--tinta); border-radius: 3px; }
.barra::-moz-range-thumb { width: 10px; height: 16px; background: var(--boton); border: 2px solid var(--tinta); border-radius: 3px; }
.barra:disabled { opacity: .4; cursor: default; }

/* los botones, como los de una grabadora */
.botones { grid-column: 1 / 4; display: flex; align-items: center; gap: 5px; }
.tb { flex: 1; height: 30px; display: grid; place-items: center; padding: 0; background: var(--boton); border: var(--borde) solid var(--linea); border-radius: var(--radio-btn); color: var(--tinta); box-shadow: var(--sombra-btn); }
.tb svg { width: 12px; height: 12px; fill: currentColor; }
.tb:hover:not(:disabled) { border-color: var(--tenue); }
.tb:disabled { color: var(--tenue); opacity: .45; cursor: default; }
.tb[aria-pressed="true"] { background: var(--neon-suave); border-color: var(--neon-borde); }
#bRec svg { fill: #E5484D; width: 13px; height: 13px; }
#bRec[aria-pressed="true"] { background: #E5484D; border-color: #E5484D; }
#bRec[aria-pressed="true"] svg { fill: #fff; }
.tomas-btn { flex: 1.6; display: flex; align-items: center; justify-content: space-between; gap: 4px; height: 30px; padding: 0 8px; background: var(--boton); border: var(--borde) solid var(--linea); border-radius: var(--radio-btn); color: var(--tinta); font-family: var(--f-etiqueta); font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.tomas-btn span { overflow: hidden; text-overflow: ellipsis; }

/* la barra de desplazamiento, la de Meowdacity (delgada y redonda), también en los menús */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--linea); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--tenue); }
::-webkit-scrollbar-track { background: transparent; }
@supports not selector(::-webkit-scrollbar) { * { scrollbar-width: thin; scrollbar-color: var(--linea) transparent; } }   /* Firefox */
/* el menú de las tomas */
.menu { position: fixed; z-index: 10; min-width: 0; width: max-content; max-height: calc(100% - 16px); overflow-y: auto; padding: 5px; background: var(--panel); border: var(--borde) solid var(--linea); border-radius: calc(var(--radio-btn) + 3px); box-shadow: 0 14px 34px rgba(62, 60, 140, .25); }
body[data-piel="neli"] .menu { background: #fff; }
.menu button { display: flex; justify-content: space-between; gap: 10px; width: 100%; white-space: normal; overflow-wrap: anywhere; padding: 6px 8px; background: none; border: 0; border-radius: 6px; text-align: left; color: var(--texto); }
.menu button:hover, .menu button:focus-visible { background: var(--neon-suave); }
.menu button[aria-current="true"] { color: var(--tinta); font-weight: 700; }
.menu .dat { color: var(--tenue); font-family: var(--f-numero); }
.menu hr { border: 0; border-top: var(--borde) solid var(--linea-suave); margin: 4px 2px; }
.menu .borrar { color: var(--umbral); }
.menu h3 { margin: 4px 8px 2px; }

/* los avisos aparecen un rato en la pantallita, arriba, y se van */
.aviso { position: absolute; left: 30px; right: 30px; top: 3px; font-family: var(--f-texto); font-size: 10.5px; line-height: 1.25; color: #A8F0C8; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; text-shadow: 0 0 4px #000, 0 0 2px #000; }
.aviso.ver { opacity: 1; }
.aviso strong { color: #F2FFF7; font-weight: 600; }

body.patita, body.patita button { cursor: var(--patita), auto; }
body.en-ventana { --fondo-img: none; }
/* dentro de NeliOS en escritorio, el enchufe de verdad (el del cable) va justo encima del dibujado */
body.con-cables .toma-hembra .hueco { visibility: hidden; }
</style>
</head>

<main class="aparato" role="main">
  <h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Grabadora</h1>
  <div class="lado">
<button type="button" class="mic" id="bMic" aria-pressed="false" title="Grabar del micrófono o la interfaz"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg><span class="etq">mic</span></button>
    <button type="button" class="toma-hembra entrada" id="tEntrada" aria-pressed="false" title="Entrada de línea: aquí se enchufa el cable de Meowdacity"><span class="hueco"></span><span class="etq">línea</span><span class="led"></span></button>
  </div>
  <div class="pantalla" aria-hidden="true">
    <canvas id="lienzo" width="180" height="60"></canvas>

    <div class="lecturas"><span id="lPos">0:00,0</span><span id="lNivel">— dB</span><span id="lLargo"><b>0:00,0</b></span></div>
  </div>
  <div class="lado">
    <button type="button" class="toma-hembra salida" id="tSalida" aria-pressed="false" title="Salida: con el cable en una pista del Estudio, lo que grabes cae ahí"><span class="hueco"></span><span class="etq">salida</span><span class="led"></span></button>
  </div>
  <input type="range" class="barra" id="barra" min="0" max="1000" value="0" step="1" aria-label="Posición en la toma" disabled>
  <div class="botones">
    <button type="button" class="tb" id="bInicio" aria-label="Al comienzo" title="Al comienzo"><svg viewBox="0 0 8 8"><rect x="0.5" y="1" width="1.2" height="6"/><path d="M5 1L1.8 4L5 7ZM8 1L4.8 4L8 7Z"/></svg></button>
    <button type="button" class="tb" id="bFin" aria-label="Al final" title="Al final"><svg viewBox="0 0 8 8"><path d="M0 1L3.2 4L0 7ZM3 1L6.2 4L3 7Z"/><rect x="6.3" y="1" width="1.2" height="6"/></svg></button>
    <button type="button" class="tb" id="bPlay" aria-pressed="false" aria-label="Escuchar la toma" title="Escuchar"><svg viewBox="0 0 8 8"><path d="M1.5 1L7 4L1.5 7Z"/></svg></button>
    <button type="button" class="tb" id="bStop" aria-label="Detener" title="Detener"><svg viewBox="0 0 8 8"><rect x="1.5" y="1.5" width="5" height="5"/></svg></button>
    <button type="button" class="tb" id="bRec" aria-pressed="false" aria-label="Grabar" title="Grabar (barra espaciadora)"><svg viewBox="0 0 8 8"><circle cx="4" cy="4" r="3"/></svg></button>
    <button type="button" class="tomas-btn" id="bTomas" aria-haspopup="menu" aria-expanded="false" title="Las tomas grabadas"><span id="tomaNom">sin tomas</span><span aria-hidden="true">▾</span></button>
  </div>
</main>
<div class="menu" id="menu" role="menu" hidden></div>
<script>
(() => {
  'use strict';
  /* La Grabadora v02: chica, como una grabadora de cinta. Solo graba.
     Entra lo que llega por el enchufe de LÍNEA (el cable de Meowdacity) o por el MIC (el micrófono o la interfaz).
     Sale por el enchufe de SALIDA: con el cable en una pista del Estudio, la toma cae ahí, a tiempo con la cinta.
     Las tomas quedan en el menú de tomas: se escuchan aquí, se mandan a Meowdacity o al Estudio, se bajan como .wav.
     Dentro de NeliOS usa el motor de audio del escritorio: el mismo reloj que Meowdacity y el Estudio. */
  const $ = id => document.getElementById(id);
  const MAXSEG = 300;
  const dec = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',').replace('-', '−');
  const miles = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const leerLS = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const guardarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let relojAviso = 0;
  const decir = h => { const d = $('dice'); d.innerHTML = h; d.classList.add('ver'); clearTimeout(relojAviso); relojAviso = setTimeout(() => d.classList.remove('ver'), 4500); };   // un aviso corto en la pantallita
  const mmss = s => Math.floor(s / 60) + ':' + dec(s % 60, 1).padStart(4, '0');
  const compartido = (() => { try { return window.parent !== window && window.parent.neliAudio ? window.parent.neliAudio : null; } catch (e) { return null; } })();
  const app = id => compartido ? compartido.app(id) : null;

  // ---------- el oído: cada bloque de 128 muestras llega con su número de muestra (el reloj del audio) ----------
  const CODIGO = `class OrejaGrabadora extends AudioWorkletProcessor {
    constructor() { super(); this.on = false; this.port.onmessage = e => { this.on = e.data.on; }; }
    process(ins) {
      const i = ins[0];
      if (i && i.length && this.on) { const a = i[0], b = i[1] || i[0]; this.port.postMessage({ f: currentFrame, a: a.slice(0), b: b.slice(0) }); }
      return true;
    }
  }
  registerProcessor('oreja-grabadora-2', OrejaGrabadora);`;
  let ctx = null, oreja = null, entrada = null, anaIn = null, mic = null, stream = null, mdNodo = null, cargando = null;
  async function motor() {
    if (oreja) { if (ctx.state === 'suspended') await ctx.resume(); return true; }
    if (cargando) return cargando;
    cargando = (async () => {
      try {
        ctx = compartido ? compartido.ctx() : new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        if (ctx.state === 'suspended') await ctx.resume();
        const urls = []; try { urls.push(URL.createObjectURL(new Blob([CODIGO], { type: 'application/javascript' }))); } catch (e) {}
        urls.push('data:application/javascript;charset=utf-8,' + encodeURIComponent(CODIGO));   // la blob no carga desde file://, la data sí
        if (compartido) await compartido.modulo('oreja-grabadora-2', urls);
        else { let ok = false; for (const u of urls) { try { await ctx.audioWorklet.addModule(u); ok = true; break; } catch (e) {} } if (!ok) throw new Error('módulo'); }
        oreja = new AudioWorkletNode(ctx, 'oreja-grabadora-2', { numberOfInputs: 1, numberOfOutputs: 0, channelCount: 2, channelCountMode: 'explicit', channelInterpretation: 'speakers' });
        oreja.port.onmessage = e => { if (grab) grab.push(e.data); };
        entrada = ctx.createGain(); anaIn = ctx.createAnalyser(); anaIn.fftSize = 1024;
        entrada.connect(oreja); entrada.connect(anaIn);
        return true;
      } catch (e) { decir('El navegador no dejó encender el audio (' + esc(e.name || e.message || e) + '). Toca la ventana y vuelve a intentar.'); oreja = null; return false; }
      finally { cargando = null; }
    })();
    return cargando;
  }

  // ---------- qué entra: LÍNEA (Meowdacity por el cable) o MIC (el micrófono o la interfaz) ----------
  let fuente = 'mic', disp = leerLS('grabadora.dispositivo', ''), cableEntrada = null, destino = null, hayEstudio = false, caraCables = false;
  async function abrirMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { decir('Este navegador no da el micrófono a esta página.'); return false; }
    if (!(await motor())) return false;
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (mic) { try { mic.disconnect(); } catch (e) {} mic = null; }
      // sin cancelación de eco, sin supresión de ruido, sin ganancia automática: lo que entra, tal cual
      stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: disp ? { exact: disp } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: { ideal: 2 }, latency: { ideal: 0 } } });
    } catch (e) {
      const t = { NotAllowedError: 'No hay permiso para el micrófono. Haz clic en el ícono a la izquierda de la dirección → <strong>Micrófono: Permitir</strong>.', NotFoundError: 'No encontré ninguna entrada de audio.', OverconstrainedError: 'Esa entrada ya no está. Elige otra.', NotReadableError: 'Otro programa está usando la entrada.' }[e.name];
      decir(t || 'No pude abrir el micrófono (' + esc(e.name || e) + ').'); if (e.name === 'OverconstrainedError') { disp = ''; guardarLS('grabadora.dispositivo', ''); }
      return false;
    }
    mic = ctx.createMediaStreamSource(stream);
    const tr = stream.getAudioTracks()[0];
    decir('MIC: <strong>' + esc(tr.label || 'el micrófono') + '</strong>. Lo fuerte, cerca de −6 dB.');
    return true;
  }
  async function conectarFuente() {
    if (!(await motor())) return false;
    if (mdNodo) { try { mdNodo.disconnect(entrada); } catch (e) {} mdNodo = null; }
    if (mic) { try { mic.disconnect(entrada); } catch (e) {} }
    if (fuente === 'meowdacity') {
      const md = app('meowdacity'); if (!md) { decir('Meowdacity no está abierta.'); return false; }

    if (!compartido) return;
    const c = id => { const r = $(id).querySelector('.hueco').getBoundingClientRect(); return [Math.round(r.left + r.width / 2), Math.round(r.top + r.height / 2)]; };
    const d = { entrada: c('tEntrada'), salida: c('tSalida') }, k = JSON.stringify(d);
    if (k === ultEnch) return; ultEnch = k;
    try { parent.postMessage(Object.assign({ nelios: 'enchufesCara' }, d), '*'); } catch (e) {}
  }
  addEventListener('resize', () => { ultEnch = ''; avisarEnchufes(); });
  setInterval(avisarEnchufes, 500);
  window.addEventListener('message', e => {
    if (e.source !== window.parent) return;
    const d = e.data; if (!d || typeof d.nelios !== 'string') return;
    if (d.nelios === 'cursor') {
      if (typeof d.patita === 'string' && d.patita.startsWith('data:image/')) { document.documentElement.style.setProperty('--patita', 'url(' + d.patita + ') 4 2'); document.body.classList.add('patita'); }
      else document.body.classList.remove('patita');
    }
    if (d.nelios === 'cable') {
      const antes = cableEntrada; cableEntrada = d.entrada || null; hayEstudio = !!d.estudio; caraCables = !!d.cara;
      document.body.classList.toggle('con-cables', caraCables);
      if (estado !== 'grabando') destino = typeof d.pista === 'number' ? d.pista : null;
      if (cableEntrada === 'meowdacity') { fuente = 'meowdacity'; if (oreja) conectarFuente(); if (antes !== 'meowdacity') decir('Entra lo que suena en <strong>Meowdacity</strong>, por la LÍNEA.'); }
      else if (antes === 'meowdacity' && fuente === 'meowdacity') { fuente = 'mic'; if (oreja) conectarFuente(); }
      pintarEntrada(); ultEnch = ''; avisarEnchufes();
    }
  });
  const ponerPiel = () => { let v = 'neli'; try { v = localStorage.getItem('meowdacity.piel') || 'neli'; } catch (e) {} document.body.dataset.piel = v === 'terminal' ? 'terminal' : 'neli'; };
  addEventListener('storage', e => { if (e.key === 'meowdacity.piel') ponerPiel(); });

  // al cerrar la ventana: se suelta todo (el motor del escritorio sigue vivo)
  function apagar() {
    try { if (grab) oreja.port.postMessage({ on: false }); grab = null; if (usaEstudio) usaEstudio.terminarToma(); } catch (e) {}
    try { pararOir(); if (mdNodo) mdNodo.disconnect(entrada); if (mic) mic.disconnect(); if (entrada) entrada.disconnect(); if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  }
  addEventListener('pagehide', apagar);
  if (compartido) compartido.registrar('grabadora', { apagar });

  // ---------- partir ----------
  ponerPiel(); pintarEntrada(); pintar(); pintarTomas(); requestAnimationFrame(cuadro);
  window.__grabadora = { estado: () => estado, fuente: () => fuente, destino: () => destino, t0: () => t0, listar, ctx: () => ctx, info: () => info, cur: () => cur };
})();

</script>
